[workspace]
members = [
    "crates/orna-base",
    "crates/orna-application",
    "crates/orna-cli",
    "crates/orna-cli-support",
    "crates/archive/orna-compat-v1",
    "crates/orna-unicode",
    "crates/orna-intrinsics",
    "crates/orna-conformance",
    "crates/orna-differential",
    "crates/orna-evolution",
    "crates/orna-format3",
    "crates/orna-evaluator",
    "crates/orna-exec",
    "crates/orna-hir",
    "crates/orna-lsp",
    "crates/orna-live",
    "crates/orna-link",
    "crates/orna-native-loader",
    "crates/orna-protocol",
    "crates/orna-project",
    "crates/orna-project-repl",
    "crates/orna-repl",
    "crates/orna-repository",
    "crates/orna-runtime",
    "crates/orna-table",
    "crates/orna-serving",
    "crates/orna-security",
    "crates/orna-check",
    "crates/orna-sys-macros",
    "crates/orna-standard-sources",
    "crates/orna-storage",
    "crates/orna-stream",
    "crates/orna-syntax",
    "crates/orna-syntax-ast",
    "crates/orna-sys",
    "crates/orna-sys-codegen",
    "crates/orna-sys-id",
    "crates/orna-sys-interface",
    "crates/orna-sys-model",
    "crates/orna-traceability",
    "crates/orna-value",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"

[workspace.dependencies]
base64 = "0.22.1"
uuid = { version = "1.18.1", features = ["v4"] }
