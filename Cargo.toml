[workspace]
members = [
    "crates/orna-artifact",
    "crates/orna-client",
    "crates/orna-cli-v1",
    "crates/orna-compiler",
    "crates/orna-core",
    "crates/orna-foundation-v1",
    "crates/orna-conformance-v1",
    "crates/orna-evolution-v1",
    "crates/orna-execution-v1",
    "crates/orna-lsp",
    "crates/orna-postgres",
    "crates/orna-protocol",
    "crates/orna-protocol-v1",
    "crates/orna-repository-v1",
    "crates/orna-runtime-v1",
    "crates/orna-runtime-tty",
    "crates/orna-serving-v1",
    "crates/orna-security-v1",
    "crates/orna-semantic-v1",
    "crates/orna-server",
    "crates/orna-sqlite",
    "crates/orna-standard",
    "crates/orna-storage",
    "crates/orna-storage-v1",
    "crates/orna-stream-v1",
    "crates/orna-syntax",
    "crates/orna-syntax-v1",
    "crates/orna-sys-v1",
    "crates/orna-traceability-v1",
    "crates/orna-value-v1",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
rowan = "0.16.1"
uuid = { version = "1.18.1", features = ["v4"] }
