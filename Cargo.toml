[workspace]
members = [
    "crates/orna-application",
    "crates/orna-cli",
    "crates/orna-core",
    "crates/orna-foundation",
    "crates/orna-conformance",
    "crates/orna-evolution",
    "crates/orna-evaluator",
    "crates/orna-lsp",
    "crates/orna-live",
    "crates/orna-protocol",
    "crates/orna-project",
    "crates/orna-repository",
    "crates/orna-runtime",
    "crates/orna-table",
    "crates/orna-serving",
    "crates/orna-security",
    "crates/orna-semantic",
    "crates/orna-sys-macros",
    "crates/orna-standard-sources",
    "crates/orna-storage",
    "crates/orna-stream",
    "crates/orna-syntax",
    "crates/orna-sys",
    "crates/orna-traceability",
    "crates/orna-value",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"

[workspace.dependencies]
base64 = "0.22.1"
uuid = { version = "1.18.1", features = ["v4"] }
