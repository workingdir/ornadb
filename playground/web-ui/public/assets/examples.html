<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse committed Orna playground examples." />
    <link rel="stylesheet" href="/playground/assets/examples.css" />
    <title>Orna playground examples</title>
  </head>
  <body>
    <header class="page-header">
      <h1>Playground examples</h1>

    <script type="module" src="/playground/assets/examples.mjs"></script>
