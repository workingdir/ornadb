<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Edit and run Orna source in the browser." />
    <title>Orna playground</title>
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>Orna playground</h1>
        <p><a href="/">Database</a> · Edit and run Orna source.</p>
      </header>

      <div class="workspace">
        <section class="editor-pane" aria-labelledby="source-title">
          <div class="pane-heading">
            <h2 id="source-title">Source</h2>
            <label for="examples">Example</label>
            <select id="examples" disabled>
              <option>Loading examples…</option>
            </select>
            <button id="run-button" type="button" disabled>Run</button>
            <button id="stop-button" type="button" disabled>Stop</button>
          </div>
          <div id="editor" aria-label="Orna source editor"></div>
          <p class="editor-status" id="editor-status" role="status">Loading editor</p>
        </section>

        <section class="output-pane" aria-labelledby="results-title">
          <div class="pane-heading">
            <h2 id="results-title">Results</h2>
            <span id="execution-state" role="status">Waiting</span>
          </div>
          <div class="tabs" role="tablist" aria-label="Execution result views">
            <button type="button" role="tab" id="tab-output" aria-controls="panel-output" aria-selected="true" data-output-tab="output">Output</button>
            <button type="button" role="tab" id="tab-values" aria-controls="panel-values" aria-selected="false" data-output-tab="values">Values</button>
            <button type="button" role="tab" id="tab-errors" aria-controls="panel-errors" aria-selected="false" data-output-tab="errors">Errors</button>
            <button type="button" role="tab" id="tab-ast" aria-controls="panel-ast" aria-selected="false" data-output-tab="ast">AST</button>
          </div>
          <div class="panels" aria-live="polite" aria-atomic="false">
            <section id="panel-output" role="tabpanel" aria-labelledby="tab-output" data-output-panel="output">
              <h3>Stdout</h3>
              <pre id="stdout-output">Run source to see output.</pre>
            </section>
            <section id="panel-values" role="tabpanel" aria-labelledby="tab-values" data-output-panel="values" hidden>
              <h3>Returned values</h3>
              <pre id="values-output">Returned values appear here.</pre>
            </section>
            <section id="panel-errors" role="tabpanel" aria-labelledby="tab-errors" data-output-panel="errors" hidden>
              <h3>Errors</h3>
              <pre id="errors-output">Diagnostics appear here.</pre>
            </section>
            <section id="panel-ast" role="tabpanel" aria-labelledby="tab-ast" data-output-panel="ast" hidden>
              <h3>Syntax tree</h3>
              <pre id="ast-output">The parsed syntax tree appears here.</pre>
            </section>
          </div>
          <p class="output-status" id="output-status">Run source to view its results.</p>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
