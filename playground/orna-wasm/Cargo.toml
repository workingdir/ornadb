[package]
name = "orna-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
test-stub-run = []

[dependencies]
orna-evaluator-v1 = { path = "../../crates/orna-evaluator-v1", default-features = false }
orna-foundation-v1 = { path = "../../crates/orna-foundation-v1" }
orna-syntax-v1 = { path = "../../crates/orna-syntax-v1" }
orna-value-v1 = { path = "../../crates/orna-value-v1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.105"

[dev-dependencies]
wasm-bindgen-test = "0.3.55"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
