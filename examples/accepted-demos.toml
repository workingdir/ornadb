# Accepted API demos. Sources remain in the canonical test fixture directory.
#
# `mode = "source-check"` invokes the public offline source checker.
# `mode = "offline-test"` invokes the named focused offline proof.
# `mode = "compose-only"` is listed for discoverability but not run locally.

[[demos]]
name = "server-functions"
mode = "source-check"
source = "crates/orna-server/tests/fixtures/server_function_dogfood.orna"
description = "SERVER query, stream, and mutation functions."

[[demos]]
name = "client-function"
mode = "source-check"
source = "crates/orna-server/tests/fixtures/client_function_dogfood.orna"
description = "A minimal Boolean CLIENT function."


