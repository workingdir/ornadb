[package]
name = "orna-cli-testkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
publish = false

# Test-only fixture builders shared by the orna-cli and orna-fuse test targets.
# Dev-dependency only; the shipped binary never links this.

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[dependencies]
sha2 = "0.10"
tempfile = "3.23.0"
orna-base = { path = "../orna-base" }
orna-check = { path = "../orna-check" }
orna-cli-support = { path = "../orna-cli-support" }
orna-conformance = { path = "../orna-conformance" }
orna-evaluator = { path = "../orna-evaluator", features = ["test-evidence"] }
orna-project = { path = "../orna-project" }
orna-repository = { path = "../orna-repository", features = ["legacy-fixture-writer"] }
orna-runtime = { path = "../orna-runtime" }
orna-value = { path = "../orna-value" }
