[package]
name = "orna-application"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
description = "Authoritative source admission and activation seam for Orna applications"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
browser-wasm = ["orna-evaluator/browser-wasm"]
test-support = []
[dependencies]
orna-base = { path = "../orna-base" }
orna-sys-id = { path = "../orna-sys-id" }
orna-evaluator = { path = "../orna-evaluator" }
orna-project-repl = { path = "../orna-project-repl" }
orna-intrinsics = { path = "../orna-intrinsics" }
orna-runtime = { path = "../orna-runtime" }
orna-check = { path = "../orna-check" }
orna-value = { path = "../orna-value" }
orna-syntax = { path = "../orna-syntax" }
orna-syntax-ast = { path = "../orna-syntax-ast" }
orna-live = { path = "../orna-live", features = ["first-party-effect-trust"] }
orna-live-lease = { path = "../orna-live-lease" }
orna-protocol = { path = "../orna-protocol" }
orna-project = { path = "../orna-project" }
num-bigint = "0.4.6"
sha2 = "0.10.9"
getrandom = "0.3.4"
orna-repository = { path = "../orna-repository" }
orna-security = { path = "../orna-security" }

[dev-dependencies]
orna-stream-identity = { path = "../orna-stream-identity" }
orna-evaluator = { path = "../orna-evaluator", features = ["test-evidence"] }
futures = "0.3.31"
orna-application = { path = ".", features = ["test-support"] }
orna-repository = { path = "../orna-repository", features = ["legacy-fixture-writer"] }
tempfile = "3.23.0"
