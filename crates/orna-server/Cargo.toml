[package]
name = "orna-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
test-hooks = []

[[bin]]
name = "orna"
path = "src/main.rs"

[dependencies]
futures = "0.3.31"
getrandom = "0.3.4"
orna-live-v1 = { path = "../orna-live-v1" }
nix = { version = "0.31.3", features = ["fs", "process", "signal", "term", "user"] }
orna-artifact = { path = "../orna-artifact" }
orna-client = { path = "../orna-client" }
orna-compiler = { path = "../orna-compiler" }
orna-core = { path = "../orna-core" }
orna-postgres = { path = "../orna-postgres", features = ["embedded"] }
orna-protocol = { path = "../orna-protocol" }
orna-protocol-v1 = { path = "../orna-protocol-v1" }
orna-runtime-tty = { path = "../orna-runtime-tty" }
orna-runtime-v1 = { path = "../orna-runtime-v1" }
orna-repository-v1 = { path = "../orna-repository-v1" }
orna-security-v1 = { path = "../orna-security-v1" }
orna-serving-v1 = { path = "../orna-serving-v1" }
orna-sqlite = { path = "../orna-sqlite" }
orna-standard = { path = "../orna-standard" }
orna-storage = { path = "../orna-storage" }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7.18"

[dev-dependencies]
orna-postgres = { path = "../orna-postgres", features = ["test-hooks"] }
turso = { version = "0.8.0-pre.7", default-features = false }
