[package]
name = "orna-sys-codegen"
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
description = "Build-time sys API and host-registry generation used by orna-sys"

[dependencies]
orna-sys-id = { path = "../orna-sys-id" }
orna-sys-model = { path = "../orna-sys-model" }
quote = "1.0.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
syn = { version = "2.0.119", features = ["full", "visit"] }

[build-dependencies]
orna-sys-id = { path = "../orna-sys-id" }
