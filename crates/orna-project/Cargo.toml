[package]
name = "orna-project"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
description = "Bounded Git-worktree source loader for Orna 1.0 projects"

[dependencies]
orna-base = { path = "../orna-base" }
orna-repository = { path = "../orna-repository" }
orna-check = { path = "../orna-check" }
orna-syntax = { path = "../orna-syntax" }
orna-syntax-ast = { path = "../orna-syntax-ast" }
orna-value = { path = "../orna-value" }
orna-unicode = { path = "../orna-unicode" }
num-bigint = "0.4.6"
orna-runtime = { path = "../orna-runtime" }
orna-exec = { path = "../orna-exec" }
unicode-normalization = "=0.1.24"

[dev-dependencies]
tempfile = "3.23.0"
