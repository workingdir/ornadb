[package]
name = "orna-application-v1"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Authoritative source admission and activation seam for Orna applications"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
browser-wasm = ["orna-evaluator-v1/browser-wasm"]
test-support = []
[dependencies]
orna-evaluator-v1 = { path = "../orna-evaluator-v1" }
orna-foundation-v1 = { path = "../orna-foundation-v1" }
orna-runtime-v1 = { path = "../orna-runtime-v1" }
orna-semantic-v1 = { path = "../orna-semantic-v1" }
orna-value-v1 = { path = "../orna-value-v1" }
orna-syntax-v1 = { path = "../orna-syntax-v1" }
orna-live-v1 = { path = "../orna-live-v1" }
orna-protocol-v1 = { path = "../orna-protocol-v1" }
orna-project-v1 = { path = "../orna-project-v1" }
num-bigint = "0.4.6"
sha2 = "0.10.9"
getrandom = "0.3.4"
orna-repository-v1 = { path = "../orna-repository-v1" }
orna-security-v1 = { path = "../orna-security-v1" }

[dev-dependencies]
futures = "0.3.31"
orna-application-v1 = { path = ".", features = ["test-support"] }
