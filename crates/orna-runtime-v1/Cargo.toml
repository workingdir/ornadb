[package]
name = "orna-runtime-v1"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Private, single-writer local runtime state for Orna 1.0"

# This deliberately stays outside the parent workspace until its owner elects
# to integrate it. It has an independent lockfile and no workspace mutation.
[workspace]

[dependencies]
libsql = { version = "0.9.29", default-features = false, features = ["core"] }
num-bigint = "0.4.6"
orna-foundation-v1 = { path = "../orna-foundation-v1" }
orna-repository-v1 = { path = "../orna-repository-v1" }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
