[package]
name = "orna-sys"
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
description = "Final Orna 1.1.0 portable sys catalogue and bounded pre-effect admission"
build = "build.rs"

[features]
default = []
dev-sys-export = []

[[bin]]
name = "sys-api-export"
path = "src/bin/sys-api-export.rs"
required-features = ["dev-sys-export"]
test = false
bench = false

[dependencies]
orna-base = { path = "../orna-base" }
orna-host-fs = { path = "../orna-host-fs" }
orna-security = { path = "../orna-security" }
orna-sys-id = { path = "../orna-sys-id" }
orna-sys-macros = { path = "../orna-sys-macros" }
orna-sys-model = { path = "../orna-sys-model" }
orna-value = { path = "../orna-value" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["v4"] }
reqwest = { version = "0.12.7", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }

[build-dependencies]
orna-sys-codegen = { path = "../orna-sys-codegen" }

[dev-dependencies]
orna-sys-codegen = { path = "../orna-sys-codegen" }
orna-sys-model = { path = "../orna-sys-model" }
orna-syntax = { path = "../orna-syntax" }
orna-syntax-ast = { path = "../orna-syntax-ast" }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.23.0"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "0.38.44", default-features = false, features = ["fs", "process", "std"] }
