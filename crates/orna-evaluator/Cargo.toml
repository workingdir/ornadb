[package]
name = "orna-evaluator"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
description = "Bounded deterministic evaluator for the Orna 1.0 expression subset"

[lib]
crate-type = ["rlib", "cdylib"]

# The H0 baseline benchmarks of the HIR design (section 7.4). They print one
# JSON record of deterministic step and call counters; `route-trace` is
# required, so no default build compiles or ships them.
[[bin]]
name = "orna_bench"
path = "src/bin/orna_bench.rs"
required-features = ["route-trace"]

[features]
default = ["system-host-bindings"]
system-host-bindings = ["dep:orna-sys", "dep:orna-repository"]
# Unstable test seam: exposes EffectGate::admit_unbound_for_test to dependent test suites.
test-evidence = []
browser-wasm = ["getrandom/wasm_js", "dep:uuid", "uuid/js"]
# Unstable test seam for orna-project-repl: exposes CancellationToken::request_after_checks.
cancellation-test-hooks = []
# Test-only call-route recording for the HIR differential harness (HIR design
# section 6.2, stage H0). Off in every shipped build; deleted in stage H9.
route-trace = []

[dependencies]
num-bigint = "0.4.6"
num-integer = "0.1.47"
num-traits = "0.2.19"
libm = "0.2.16"
getrandom = "0.3.4"
uuid = { version = "1.18.1", default-features = false, optional = true }
icu_properties = "2.2.0"
serde = "1.0"
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "raw_value"] }
stacker = "0.1.25"
orna-intrinsics = { path = "../orna-intrinsics" }
orna-repository = { path = "../orna-repository", optional = true }
orna-standard-sources = { path = "../orna-standard-sources" }
orna-check = { path = "../orna-check" }
orna-sys = { path = "../orna-sys", optional = true }
orna-syntax = { path = "../orna-syntax" }
orna-syntax-ast = { path = "../orna-syntax-ast" }
orna-value = { path = "../orna-value" }
orna-unicode = { path = "../orna-unicode" }
sha2 = "0.10.9"
unicode-normalization = "=0.1.24"
unicode-case-mapping = "=1.0.0"

[dev-dependencies]
orna-project = { path = "../orna-project" }
orna-project-repl = { path = "../orna-project-repl" }
tempfile = "3.23.0"
