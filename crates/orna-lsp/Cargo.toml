[package]
name = "orna-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "orna-lsp"
path = "src/main.rs"

[dependencies]
lsp-types = "0.97.0"
orna-base = { path = "../orna-base" }
orna-project = { path = "../orna-project" }
orna-repository = { path = "../orna-repository" }
orna-check = { path = "../orna-check" }
orna-hir = { path = "../orna-hir" }
orna-link = { path = "../orna-link" }
orna-standard-sources = { path = "../orna-standard-sources" }
orna-syntax = { path = "../orna-syntax" }
orna-syntax-ast = { path = "../orna-syntax-ast" }
serde_json = "1.0.151"
url = "2.5.7"
[dev-dependencies]
tempfile = "3.23.0"
orna-repository = { path = "../orna-repository", features = ["legacy-fixture-writer"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lsp-server = "0.10"

