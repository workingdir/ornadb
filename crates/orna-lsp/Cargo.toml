[package]
name = "orna-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "orna-lsp"
path = "src/main.rs"

[dependencies]
lsp-types = "0.97.0"
orna-project-v1 = { path = "../orna-project-v1" }
orna-repository-v1 = { path = "../orna-repository-v1" }
orna-semantic-v1 = { path = "../orna-semantic-v1" }
orna-standard-sources = { path = "../orna-standard-sources" }
orna-syntax-v1 = { path = "../orna-syntax-v1" }
serde_json = "1.0.151"
url = "2.5.7"
[dev-dependencies]
tempfile = "3.23.0"
orna-repository-v1 = { path = "../orna-repository-v1", features = ["legacy-fixture-writer"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lsp-server = "0.10"

