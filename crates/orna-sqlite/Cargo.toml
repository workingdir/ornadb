[package]
name = "orna-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
orna-core = { path = "../orna-core" }
orna-artifact = { path = "../orna-artifact" }
orna-protocol = { path = "../orna-protocol" }
orna-storage = { path = "../orna-storage" }
orna-standard = { path = "../orna-standard" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
turso = { version = "0.8.0-pre.7", default-features = false }
tokio = { version = "1.53.1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
