[package]
name = "orna-sys-v1"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Bounded pre-effect admission for Orna 1.0 reflective invocation"
build = "build.rs"

[features]
default = ["native-hosts"]
dev-sys-export = []
native-hosts = ["dep:reqwest", "uuid/v4"]

[[bin]]
name = "sys-api-export"
path = "src/bin/sys-api-export.rs"
required-features = ["dev-sys-export"]
test = false
bench = false

[dependencies]
orna-security-v1 = { path = "../orna-security-v1" }
orna-sys-macros = { path = "../orna-sys-macros" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.151"
uuid = { version = "1.26.0", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12.7", optional = true, default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }

[build-dependencies]
quote = "1.0.45"
serde_json = "1.0.151"
syn = { version = "2.0.119", features = ["full", "visit"] }

[dev-dependencies]
quote = "1.0.45"
orna-syntax-v1 = { path = "../orna-syntax-v1" }
syn = { version = "2.0.119", features = ["full", "visit"] }
