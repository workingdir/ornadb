[package]
name = "orna-sys-v1"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Bounded pre-effect admission for Orna 1.0 reflective invocation"
build = "build.rs"

[dependencies]
orna-security-v1 = { path = "../orna-security-v1" }
orna-sys-macros = { path = "../orna-sys-macros" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.151"

[build-dependencies]
serde_json = "1.0.151"
syn = { version = "2.0.119", features = ["full", "visit"] }

[dev-dependencies]
orna-syntax-v1 = { path = "../orna-syntax-v1" }
