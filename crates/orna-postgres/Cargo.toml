[package]
name = "orna-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[features]
embedded = []
test-hooks = ["tokio/sync"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
orna-artifact = { path = "../orna-artifact" }
orna-client = { path = "../orna-client" }
orna-core = { path = "../orna-core" }
orna-protocol = { path = "../orna-protocol" }
orna-standard = { path = "../orna-standard" }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["net", "rt"] }
tokio-postgres = "0.7.18"

[dev-dependencies]
orna-compiler = { path = "../orna-compiler" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
