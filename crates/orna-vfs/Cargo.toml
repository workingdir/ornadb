[package]
name = "orna-vfs"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license.workspace = true
description = "FUSE-free projected file handles and EDIT-1 replacement drafts for Orna 1.0"
publish = false

[dependencies]
orna-base = { path = "../orna-base" }
orna-repository = { path = "../orna-repository" }
orna-runtime = { path = "../orna-runtime" }
orna-stream = { path = "../orna-stream" }
orna-value = { path = "../orna-value" }
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "rt", "sync"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
orna-evaluator = { path = "../orna-evaluator", features = ["test-evidence"] }
num-bigint = "0.4.6"
orna-syntax = { path = "../orna-syntax" }
orna-syntax-ast = { path = "../orna-syntax-ast" }
serde_json = "1.0.151"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
