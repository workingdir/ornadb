[package]
name = "orna-repository-v1"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Git-backed repository, CWD, index, and local runtime boundary for Orna"

[features]
crash-barriers = []
# Test-only builder for legacy compact fixtures; never enabled in production.
legacy-fixture-writer = []

[dependencies]
bytes = "1.10.1"
fs2 = "0.4.3"
libc = "0.2.180"
orna-foundation-v1 = { path = "../orna-foundation-v1" }
orna-value-v1 = { path = "../orna-value-v1" }
orna-syntax-v1 = { path = "../orna-syntax-v1" }
parquet = { version = "59.3.0", default-features = false, features = ["crc", "zstd"] }
sha1 = "0.10.7"
sha2.workspace = true
tempfile = "3.23.0"
uuid.workspace = true

[dev-dependencies]
num-bigint = "0.4.6"
orna-evaluator-v1 = { path = "../orna-evaluator-v1" }
orna-runtime-v1 = { path = "../orna-runtime-v1" }
orna-storage-v1 = { path = "../orna-storage-v1" }
orna-sys-v1 = { path = "../orna-sys-v1" }
serde_json = "1.0.151"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "0.38.44", default-features = false, features = ["fs", "std"] }
