[package]
name = "orna-cli-v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[[bin]]
name = "orna-cli-v1"
path = "src/main.rs"

[features]
crash-barriers = ["orna-repository-v1/crash-barriers", "orna-runtime-v1/crash-barriers"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[dependencies]
base64 = { workspace = true }
sha2 = "0.10"
orna-application-v1 = { path = "../orna-application-v1" }
orna-client = { path = "../orna-client" }
orna-conformance-v1 = { path = "../orna-conformance-v1" }
orna-evaluator-v1 = { path = "../orna-evaluator-v1" }
orna-foundation-v1 = { path = "../orna-foundation-v1" }
orna-live-v1 = { path = "../orna-live-v1" }
orna-protocol-v1 = { path = "../orna-protocol-v1" }
orna-project-v1 = { path = "../orna-project-v1" }
orna-repository-v1 = { path = "../orna-repository-v1" }
orna-runtime-v1 = { path = "../orna-runtime-v1" }
orna-security-v1 = { path = "../orna-security-v1" }
orna-semantic-v1 = { path = "../orna-semantic-v1" }
orna-serving-v1 = { path = "../orna-serving-v1" }
orna-storage-v1 = { path = "../orna-storage-v1" }
orna-syntax-v1 = { path = "../orna-syntax-v1" }
orna-sys-v1 = { path = "../orna-sys-v1" }
orna-value-v1 = { path = "../orna-value-v1" }
serde_json = "1.0.151"
getrandom = "0.3.4"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tempfile = "3.23.0"
[[test]]
name = "publication_crash_matrix"
path = "tests/publication_crash_matrix.rs"
required-features = ["crash-barriers"]

[dev-dependencies]
bytes = "1.11.1"
libsql = { version = "0.9.29", default-features = false, features = ["core"] }
parquet = { version = "59.3.0", default-features = false, features = ["crc", "zstd"] }
tungstenite = { version = "0.26.2", features = ["handshake"] }
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18.0", default-features = false }
libc = "0.2"
rustix = { version = "0.38.44", features = ["fs", "process"] }
