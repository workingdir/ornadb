[package]
name = "orna-cli-v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[[bin]]
name = "orna-cli-v1"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[dependencies]
orna-conformance-v1 = { path = "../orna-conformance-v1" }
orna-evaluator-v1 = { path = "../orna-evaluator-v1" }
orna-foundation-v1 = { path = "../orna-foundation-v1" }
orna-project-v1 = { path = "../orna-project-v1" }
orna-repository-v1 = { path = "../orna-repository-v1" }
orna-semantic-v1 = { path = "../orna-semantic-v1" }
orna-value-v1 = { path = "../orna-value-v1" }

[dev-dependencies]
tempfile = "3.23.0"
