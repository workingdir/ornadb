<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Orna playground</title>
    <!-- style -->
  </head>
  <body>
    <main data-database="__DATABASE_ID__">
      <nav aria-label="Breadcrumb"><a href="/">Commits</a> / Playground</nav>
      <h1>Orna playground</h1>
      <p>Run source in this database. The live presentation below follows the server's current snapshot.</p>
      <form id="playground-form">
        <label for="playground-source">Orna source</label>
        <textarea id="playground-source" rows="6" spellcheck="false">1 + 1</textarea>
        <button id="run-source" type="submit" disabled>Run</button>
      </form>
      <p id="playground-status" role="status" aria-live="polite">Connecting to the database…</p>
      <section aria-labelledby="result-title">
        <h2 id="result-title">Result</h2>
        <pre id="playground-result">No run yet.</pre>
      </section>
      <section aria-labelledby="presentation-title">
        <h2 id="presentation-title">Live presentation</h2>
        <p id="live-status" role="status" aria-live="polite">Waiting for a snapshot.</p>
        <div id="live-presentation"></div>
      </section>
    </main>
    <script type="module" src="/assets/serve-playground.mjs"></script>
  </body>
</html>
