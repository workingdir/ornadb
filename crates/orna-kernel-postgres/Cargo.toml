[package]
name = "orna-kernel-postgres"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-hooks = ["orna-postgres/test-hooks"]

[dependencies]
orna-postgres = { path = "../orna-postgres" }

[dev-dependencies]
orna-client = { path = "../orna-client" }
orna-compiler = { path = "../orna-compiler" }
orna-core = { path = "../orna-core" }
orna-protocol = { path = "../orna-protocol" }
orna-standard = { path = "../orna-standard" }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-postgres = "0.7.18"
