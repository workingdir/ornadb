[package]
name = "orna-semantic"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"
description = "Read-only first semantic slice for the frozen Orna 1.0 AST"

[dependencies]
orna-foundation = { path = "../orna-foundation" }
orna-value = { path = "../orna-value" }
orna-syntax = { path = "../orna-syntax" }
serde_json = "1.0"
sha2 = "0.10.9"
num-bigint = "0.4.8"
num-traits = "0.2"
unicode-normalization = "0.1.24"
uuid = { version = "1.18.1", features = ["v4"] }
unicode-casefold = "0.2.0"
stacker = "0.1.25"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
orna-sys = { path = "../orna-sys", default-features = false }
