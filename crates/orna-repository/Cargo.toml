[package]
name = "orna-repository"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Git-backed repository, CWD, index, and local runtime boundary for Orna"

[features]
crash-barriers = []
# Test-only builder for legacy compact fixtures; never enabled in production.
legacy-fixture-writer = []

[dependencies]
bytes = "1.10.1"
fs2 = "0.4.3"
libc = "0.2.180"
num-bigint = "0.4.6"
orna-foundation = { path = "../orna-foundation" }
orna-value = { path = "../orna-value" }
orna-syntax = { path = "../orna-syntax" }
parquet = { version = "59.3.0", default-features = false, features = ["crc", "zstd"] }
sha1 = "0.10.7"
sha2 = "0.11.0"
tempfile = "3.23.0"
uuid.workspace = true

[dev-dependencies]
orna-conformance = { path = "../orna-conformance" }
orna-evaluator = { path = "../orna-evaluator" }
orna-project = { path = "../orna-project" }
orna-runtime = { path = "../orna-runtime" }
orna-semantic = { path = "../orna-semantic" }
orna-storage = { path = "../orna-storage" }
orna-sys = { path = "../orna-sys" }
serde_json = "1.0.151"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "0.38.44", default-features = false, features = ["fs", "std"] }

[[example]]
name = "build_legacy_fixture"
path = "examples/build_legacy_fixture.rs"
required-features = ["legacy-fixture-writer"]
