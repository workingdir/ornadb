[package]
name = "orna-live"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
description = "Transport-facing live-session adapter for orna.present.v1"

[features]
# Exposes the owner-bound runtime handle to this crate's integration tests.
# Also grants the first-party effect-trust witness to the test applications.
test-support = ["first-party-effect-trust"]
# Enables `FirstPartyEffectTrust::mint`. Only the first-party application
# adapter enables it; a third-party `LiveApplication` cannot obtain the witness
# without it, so its controlled effect reports are downgraded.
first-party-effect-trust = []

[dependencies]
orna-live-lease = { path = "../orna-live-lease" }
orna-sys-id = { path = "../orna-sys-id" }
orna-base = { path = "../orna-base" }
futures = "0.3.31"
getrandom = "0.3.4"
orna-evaluator = { path = "../orna-evaluator" }
orna-protocol = { path = "../orna-protocol" }
orna-runtime = { path = "../orna-runtime" }
orna-security = { path = "../orna-security" }
orna-serving = { path = "../orna-serving" }
orna-stream = { path = "../orna-stream" }
orna-value = { path = "../orna-value" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dev-dependencies]
orna-evaluator = { path = "../orna-evaluator", features = ["test-evidence"] }
orna-repository = { path = "../orna-repository" }
orna-live = { path = ".", features = ["test-support"] }
