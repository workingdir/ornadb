[package]
name = "orna-evaluator-v1"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Bounded deterministic evaluator for the Orna 1.0 expression subset"
publish = false

[dependencies]
num-bigint = "0.4.6"
num-integer = "0.1.47"
num-traits = "0.2.19"
orna-foundation-v1 = { path = "../orna-foundation-v1" }
orna-project-v1 = { path = "../orna-project-v1" }
orna-semantic-v1 = { path = "../orna-semantic-v1" }
orna-syntax-v1 = { path = "../orna-syntax-v1" }
orna-value-v1 = { path = "../orna-value-v1" }
unicode-normalization = "=0.1.24"

[dev-dependencies]
orna-repository-v1 = { path = "../orna-repository-v1" }
tempfile = "3.23.0"
