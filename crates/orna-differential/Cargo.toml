[package]
name = "orna-differential"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license.workspace = true
publish = false
description = "Corpus, old-pipeline observer and comparator for the HIR differential harness"

# Test-support only: layer 14, role harness, never in the shipped binary's
# closure (docs/design/layers.toml, docs/design/hir.md section 6.2). The
# architecture check enforces both facts.

[dependencies]
orna-exec = { path = "../orna-exec" }
orna-application = { path = "../orna-application" }
orna-check = { path = "../orna-check" }
orna-hir = { path = "../orna-hir" }
orna-evaluator = { path = "../orna-evaluator", features = ["route-trace"] }
orna-project-repl = { path = "../orna-project-repl" }
orna-standard-sources = { path = "../orna-standard-sources" }
orna-syntax = { path = "../orna-syntax" }
orna-value = { path = "../orna-value" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
orna-repl = { path = "../orna-repl" }
orna-sys = { path = "../orna-sys" }
