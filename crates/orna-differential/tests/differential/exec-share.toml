# The H4 executor agreement ratchet (docs/design/hir.md section 6.3, stage H4).
#
# `agreed` is the number of corpus cases the HIR executor ran whose outcome
# (canonical result bytes or error code) matches the old pipeline exactly. Every
# case the executor runs must agree; a disagreement fails the test outright.
# The agreed count may only grow: update it in the commit that runs more of the
# corpus.
#
# `evaluable` is the denominator: the corpus cases with `evaluate == true`, the
# cases the old pipeline yields an outcome for. It is measured, not chosen. A
# corpus change that moves it must record the new measured value in the same PR.
# Cases the executor does not run are counted by reason ("not yet on HIR") and
# are not part of `agreed`.

[[exec-share]]
agreed = 78
evaluable = 110
steps-exact = 52
old-harness-environment = 4

# Cases the executor runs by reading a table field as a function, `map(Contact.field)`, over the attached
# fixture `Contact` table. The old observer admits that table (`fixture_environment::CONTACTS_SUPPORT`), so the
# old pipeline reaches the table; the dotted `Contact.full_name` does not resolve in the old evaluator, which
# resolves a relation source by a bare table name only. The old pipeline answers `ORNA-EVAL-NAME`; the executor
# returns the spec result, the empty list (CBOR `0x80`) of an empty table. Not credited as agreement. Closing
# this needs an evaluator change to dotted field relation sources, outside the observer.

# `valid/pipeline.orna` is a `contacts.Contact` pipeline (filter, map, sort_by) over an empty table. The
# executor now runs `sort_by`, so it runs the case and returns the spec empty list (CBOR `0x80`). The old
# observer does not attach the qualified `contacts` table, so it answers `ORNA-EVAL-NAME`. Not credited as agreement.
[[harness-allowance]]
case = "valid/pipeline.orna"
reason = "old observer does not attach the qualified contacts.Contact table; HIR result is the spec empty list (the pipeline runs over an empty Contact table)"
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "valid/computed-field.orna"
reason = "old evaluator resolves only a bare table name as a relation source, so the dotted `Contact.full_name` answers ORNA-EVAL-NAME over the empty table; the executor maps the computed field over zero rows and returns the empty list the spec defines"
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "valid/default-and-computed-fields.orna"
reason = "old evaluator resolves only a bare table name as a relation source, so the dotted `Contact.full_name` answers ORNA-EVAL-NAME over the empty table; the executor maps the computed field over zero rows and returns the empty list the spec defines"
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "valid/computed-and-defaulted-fields.orna"
reason = "old evaluator resolves only a bare table name as a relation source, so the dotted `Contact.full_name` answers ORNA-EVAL-NAME over the empty table; the executor maps the computed field over zero rows and returns the empty list the spec defines"
bead = "ornadb-csenl.21"

# Cases the executor runs whose result is a raw `Blob`, which the old pipeline answers
# `ORNA-EVAL-VALUE` because its blob results are ROV3 blob references. The executor's bytes are the
# spec result; the old side is the representation gap. Matches only that exact pair (old
# `ORNA-EVAL-VALUE`, executor `Ok`); any other disagreement stays a mismatch.
[[representation-allowance]]
case = "valid/blob-range.orna"
reason = "the old pipeline answers ORNA-EVAL-VALUE for a raw Blob result (its blob values are ROV3 references, which sys.blob.from_bytes does not produce); the executor returns the canonical bytes the spec defines"
bead = "ornadb-csenl.20"

# `valid/currency.orna` evaluates `Money` values per the spec, so the HIR executor returns their
# canonical bytes. The old pipeline has no currency values and answers `ORNA-EVAL-TYPE`. Matches only
# that exact pair (old `ORNA-EVAL-TYPE`, executor `Ok`); any other disagreement stays a mismatch.
# HB8 (ornadb-csenl.40) folds this allowance into its harness work.
[[currency-allowance]]
case = "valid/currency.orna"
reason = "old pipeline cannot evaluate currency values; HIR evaluates Money per spec"
bead = "ornadb-csenl.40"

# Cases the executor does not run yet: each stops at a money or type constructor it does not
# evaluate (reason H4, raised in `orna-exec` `eval.rs` and `unit_variant.rs`). The static rejection
# these programs need is HIR typing, not an executor gap. `20.C` is typed as a plain number, so the
# E5002 affine-point rule never sees two points (owner `ornadb-csenl.37`). `90.days` is typed through
# the builtin Duration, so the E5001 dimension rule does not see two Quantities (follow-up
# `ornadb-2bga0`). Each entry matches only its exact case and reason.
[[not-yet-allowance]]
case = "invalid/affine-addition.orna"
reason = "money or type constructor (H4)"
bead = "ornadb-csenl.37"

# Cases the executor runs whose update or rekey targets a key the table does not hold. The executor
# answers the spec result for an absent row. Four disagree with the old pipeline, each for a named
# reason, and each entry matches only its exact (executor, old) pair, where `old` is an error code or
# `ok` for an old result; any other disagreement on that case stays a mismatch.
[[executor-gap-allowance]]
case = "invalid/key-update.orna"
executor = "ORNA-EVAL-TABLE-MISSING-ROW"
old = "E3002"
reason = "old pipeline rejects the key update statically (E3002); the HIR checker has no equivalent static rule, so the executor runs the update and reports the absent row (ORNA-EVAL-TABLE-MISSING-ROW). Static rejection parity is an open checker gap."
bead = "ornadb-0xfiw"

[[executor-gap-allowance]]
case = "invalid/computed-field-update.orna"
executor = "ORNA-EVAL-TABLE-MISSING-ROW"
old = "E3011"
reason = "old pipeline rejects the computed-field update statically (E3011); the HIR checker has no equivalent static rule, so the executor runs the update and reports the absent row (ORNA-EVAL-TABLE-MISSING-ROW). Static rejection parity is an open checker gap."
bead = "ornadb-0xfiw"

[[executor-gap-allowance]]
case = "invalid/rekey-auto-id.orna"
executor = "ORNA-EVAL-TABLE-UNADMITTED"
old = "E3013"
reason = "old pipeline rejects the rekey of an auto-generated id statically (E3013); the HIR checker has no equivalent static rule, so the executor reports the rekey as unadmitted (ORNA-EVAL-TABLE-UNADMITTED). Static rejection parity is an open checker gap."
bead = "ornadb-0xfiw"

# REPL admission (ORNA-REPL-002: `$_` MUST NOT become an implicit global in module source). The
# executor reports the unresolved `$_` where the old evaluator captured it in a closure, so the old
# side returns a result and the executor returns ORNA-S012-UNRESOLVED. The spec answer is the executor's.
[[executor-gap-allowance]]
case = "crates/orna-conformance/tests/fixtures/repl-admission/retained-result.orna"
executor = "ORNA-S012-UNRESOLVED"
old = "ok"
reason = "REPL `$_` read in a function body: the old evaluator captures the last result in the closure and returns it, but ORNA-REPL-002 forbids `$_` as an implicit global in module source; the executor reports it unresolved. The old answer is the non-spec behaviour."
bead = "ornadb-csenl.23.1"

# The pinned stdlib has no `std.net.http.get` (only start, wait, cancel, send), so the call does not
# resolve. The executor answers ORNA-S012-UNRESOLVED; the old pipeline classifies effects by name
# before resolution and answers ORNA-REPL-EFFECT. Once the stdlib exports the function, the executor
# answers ORNA-REPL-EFFECT at commit (the session's effect check) and these entries must go.
[[executor-gap-allowance]]
case = "crates/orna-conformance/tests/fixtures/repl-admission/effect.orna"
executor = "ORNA-S012-UNRESOLVED"
old = "ORNA-REPL-EFFECT"
reason = "std.net.http.get is absent from the pinned stdlib std/net/http.orna, so the executor reports it unresolved (ORNA-S012-UNRESOLVED); the old pipeline classifies the effect by name before resolution (ORNA-REPL-EFFECT). Stdlib export gap."
bead = "ornadb-csenl.23.3"

[[executor-gap-allowance]]
case = "crates/orna-evaluator/tests/fixtures/admitted_repl_effectful_http.orna"
executor = "ORNA-S012-UNRESOLVED"
old = "ORNA-REPL-EFFECT"
reason = "same stdlib export gap as repl-admission/effect.orna: std.net.http.get is absent from the pinned stdlib, so the executor reports it unresolved; the old pipeline answers ORNA-REPL-EFFECT by name."
bead = "ornadb-csenl.23.3"

# Agreeing cases whose step counts differ from the old pipeline. The outcomes agree; these entries only admit the
# step-count difference, and each is not counted as exact step parity.
[[step-allowance]]
case = "invalid/duplicate-key.orna"
old = 9
executor = 15
reason = "the outcomes agree (ORNA-EVAL-TABLE-DUPLICATE-KEY) over the attached Contact table; the executor charges 15 steps where the old pipeline charges 9 for the same run. The table-write step charge is not reconciled."

[[step-allowance]]
case = "valid/effectful-expression.orna"
old = 3
executor = 7
reason = "the outcomes agree (the spec record of the attached Contact insert); the executor charges 7 steps where the old pipeline charges 3 for the same run. The table-write step charge is not reconciled."
