# The H4 executor agreement ratchet (docs/design/hir.md section 6.3, stage H4).
#
# `agreed` is the number of corpus cases the HIR executor ran whose outcome
# (canonical result bytes or error code) matches the old pipeline exactly. Every
# case the executor runs must agree; a disagreement fails the test outright.
# The agreed count may only grow: update it in the commit that runs more of the
# corpus.
#
# `evaluable` is the denominator: the corpus cases with `evaluate == true`, the
# cases the old pipeline yields an outcome for. It is measured, not chosen. A
# corpus change that moves it must record the new measured value in the same PR.
# Cases the executor does not run are counted by reason ("not yet on HIR") and
# are not part of `agreed`.

[[exec-share]]
agreed = 56
evaluable = 110
steps-exact = 51
old-harness-environment = 8

# Cases the executor runs over a table the old pipeline cannot reach from its admitted module. The old
# observer admits only the case's own source, so a table the case reaches only through the attached
# fixture (`Contact`) is absent from the old admitted table set. Each such case answers `ORNA-EVAL-NAME`
# or a static rejection on the old side. The count is a ratchet that may only shrink; each case needs a
# `[[harness-allowance]]`.
[[harness-allowance]]
case = "invalid/computed-field-insert.orna"
reason = "old pipeline rejects the computed-field insert statically (E2002); the executor runs the insert against the attached Contact table and reports ORNA-EVAL-TABLE-ROW. Static rejection parity is an open executor gap."
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "invalid/duplicate-key.orna"
reason = "old pipeline answers ORNA-EVAL-NAME for the attached Contact table, which admit_module does not admit from the case's own source; the executor runs the second insert and reports the spec duplicate-key error (ORNA-EVAL-TABLE-DUPLICATE-KEY)."
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "invalid/missing-required-field.orna"
reason = "old pipeline rejects the missing required field statically (E2002); the executor runs the insert against the attached Contact table and reports ORNA-EVAL-TABLE-ROW. Static rejection parity is an open executor gap."
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "invalid/unknown-field.orna"
reason = "old pipeline rejects the unknown field statically (E2003); the executor runs the insert against the attached Contact table and reports ORNA-EVAL-TABLE-ROW. Static rejection parity is an open executor gap."
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "valid/effectful-expression.orna"
reason = "old pipeline answers ORNA-EVAL-NAME for the attached Contact table, which admit_module does not admit from the case's own source; the executor runs the insert and returns the spec record (defaults applied: id \"generated\", emails []). Not credited as agreement."
bead = "ornadb-csenl.21"

# Cases the executor runs by reading a table field as a function, `map(Contact.field)`, over the table. The
# old evaluator resolves a relation source by a bare table name only: the dotted `Contact.full_name` does not
# resolve, so the old pipeline answers `ORNA-EVAL-NAME` even with the empty table bound. The executor returns
# the spec result, the empty list (CBOR `0x80`) of an empty table. Not credited as agreement.
[[harness-allowance]]
case = "valid/computed-field.orna"
reason = "old evaluator resolves only a bare table name as a relation source, so the dotted `Contact.full_name` answers ORNA-EVAL-NAME over the empty table; the executor maps the computed field over zero rows and returns the empty list the spec defines"
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "valid/default-and-computed-fields.orna"
reason = "old evaluator resolves only a bare table name as a relation source, so the dotted `Contact.full_name` answers ORNA-EVAL-NAME over the empty table; the executor maps the computed field over zero rows and returns the empty list the spec defines"
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "valid/computed-and-defaulted-fields.orna"
reason = "old evaluator resolves only a bare table name as a relation source, so the dotted `Contact.full_name` answers ORNA-EVAL-NAME over the empty table; the executor maps the computed field over zero rows and returns the empty list the spec defines"
bead = "ornadb-csenl.21"

# Cases the executor runs whose result is a raw `Blob`, which the old pipeline answers
# `ORNA-EVAL-VALUE` because its blob results are ROV3 blob references. The executor's bytes are the
# spec result; the old side is the representation gap. Matches only that exact pair (old
# `ORNA-EVAL-VALUE`, executor `Ok`); any other disagreement stays a mismatch.
[[representation-allowance]]
case = "valid/blob-range.orna"
reason = "the old pipeline answers ORNA-EVAL-VALUE for a raw Blob result (its blob values are ROV3 references, which sys.blob.from_bytes does not produce); the executor returns the canonical bytes the spec defines"
bead = "ornadb-csenl.20"

# `valid/currency.orna` evaluates `Money` values per the spec, so the HIR executor returns their
# canonical bytes. The old pipeline has no currency values and answers `ORNA-EVAL-TYPE`. Matches only
# that exact pair (old `ORNA-EVAL-TYPE`, executor `Ok`); any other disagreement stays a mismatch.
# HB8 (ornadb-csenl.40) folds this allowance into its harness work.
[[currency-allowance]]
case = "valid/currency.orna"
reason = "old pipeline cannot evaluate currency values; HIR evaluates Money per spec"
bead = "ornadb-csenl.40"

# Cases the executor runs whose update or rekey targets a key the table does not hold. The executor
# answers the spec result for an absent row. Three disagree with the old pipeline, each for a named
# reason, and each entry matches only its exact (executor, old) error-code pair; any other
# disagreement on that case stays a mismatch.
[[executor-gap-allowance]]
case = "invalid/key-update.orna"
executor = "ORNA-EVAL-TABLE-MISSING-ROW"
old = "E3002"
reason = "old pipeline rejects the key update statically (E3002); the HIR checker has no equivalent static rule, so the executor runs the update and reports the absent row (ORNA-EVAL-TABLE-MISSING-ROW). Static rejection parity is an open checker gap."
bead = "ornadb-0xfiw"

[[executor-gap-allowance]]
case = "invalid/computed-field-update.orna"
executor = "ORNA-EVAL-TABLE-MISSING-ROW"
old = "E3011"
reason = "old pipeline rejects the computed-field update statically (E3011); the HIR checker has no equivalent static rule, so the executor runs the update and reports the absent row (ORNA-EVAL-TABLE-MISSING-ROW). Static rejection parity is an open checker gap."
bead = "ornadb-0xfiw"

[[executor-gap-allowance]]
case = "invalid/rekey-auto-id.orna"
executor = "ORNA-EVAL-TABLE-UNADMITTED"
old = "E3013"
reason = "old pipeline rejects the rekey of an auto-generated id statically (E3013); the HIR checker has no equivalent static rule, so the executor reports the rekey as unadmitted (ORNA-EVAL-TABLE-UNADMITTED). Static rejection parity is an open checker gap."
bead = "ornadb-0xfiw"
