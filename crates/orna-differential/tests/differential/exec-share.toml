# The H4 executor agreement ratchet (docs/design/hir.md section 6.3, stage H4).
#
# `agreed` is the number of corpus cases the HIR executor ran whose outcome
# (canonical result bytes or error code) matches the old pipeline exactly. Every
# case the executor runs must agree; a disagreement fails the test outright.
# The agreed count may only grow: update it in the commit that runs more of the
# corpus.
#
# `evaluable` is the denominator: the corpus cases with `evaluate == true`, the
# cases the old pipeline yields an outcome for. It is measured, not chosen. A
# corpus change that moves it must record the new measured value in the same PR.
# Cases the executor does not run are counted by reason ("not yet on HIR") and
# are not part of `agreed`.

[[exec-share]]
agreed = 48
evaluable = 110
steps-exact = 48
old-harness-environment = 9

# Cases the executor runs against a declared table that the old pipeline answers `ORNA-EVAL-NAME`
# only because the H0 observer supplies no table store for a module with no rows. The count is a
# ratchet that may only shrink; each case needs a `[[harness-allowance]]`.
[[harness-allowance]]
case = "valid/minimal-root.orna"
reason = "the H0 observer supplies no table store for a module with no rows; the executor result is the spec result (example cases run on empty tables, so `count()` is 0)"
bead = "ornadb-csenl.21"

# Cases the executor runs against an attached fixture table that the old pipeline rejects, because
# the H0 observer has no table store. The executor reports `ORNA-EVAL-TABLE-ROW` at the store
# boundary. Where the old pipeline rejects statically (E2002/E2003), the executor does not yet
# reproduce that rejection; the allowance records the gap, it does not claim parity.
[[harness-allowance]]
case = "invalid/computed-field-insert.orna"
reason = "old pipeline rejects the computed-field insert statically (E2002); the executor reaches the table store, which the H0 observer lacks (ORNA-EVAL-TABLE-ROW). Static rejection parity is an open executor gap."
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "invalid/duplicate-key.orna"
reason = "old pipeline answers ORNA-EVAL-NAME for the duplicate key because the H0 observer has no table store; the executor runs the second insert against the attached Contact store and reports the spec duplicate-key error (ORNA-EVAL-TABLE-DUPLICATE-KEY)."
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "invalid/missing-required-field.orna"
reason = "old pipeline rejects the missing required field statically (E2002); the executor reaches the table store, which the H0 observer lacks (ORNA-EVAL-TABLE-ROW). Static rejection parity is an open executor gap."
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "invalid/unknown-field.orna"
reason = "old pipeline rejects the unknown field statically (E2003); the executor reaches the table store, which the H0 observer lacks (ORNA-EVAL-TABLE-ROW). Static rejection parity is an open executor gap."
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "valid/effectful-expression.orna"
reason = "old pipeline answers ORNA-EVAL-NAME because the H0 observer has no table store for the attached Contact table; the executor runs the insert and returns the spec record (defaults applied: id \"generated\", emails []). Not credited as agreement."
bead = "ornadb-csenl.21"

# Cases the executor runs by reading a table field as a function, `map(Contact.field)`, over the table. The
# H0 observer supplies no table store for a module with no rows, so the old pipeline answers `ORNA-EVAL-NAME`;
# the executor returns the spec result, the empty list (CBOR `0x80`) of an empty table. Not credited as agreement.
[[harness-allowance]]
case = "valid/computed-field.orna"
reason = "old pipeline answers ORNA-EVAL-NAME because the H0 observer has no table store; the executor maps the table's computed field over zero rows and returns the empty list the spec defines"
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "valid/default-and-computed-fields.orna"
reason = "old pipeline answers ORNA-EVAL-NAME because the H0 observer has no table store; the executor maps the table's computed field over zero rows and returns the empty list the spec defines"
bead = "ornadb-csenl.21"

[[harness-allowance]]
case = "valid/computed-and-defaulted-fields.orna"
reason = "old pipeline answers ORNA-EVAL-NAME because the H0 observer has no table store; the executor maps the table's computed field over zero rows and returns the empty list the spec defines"
bead = "ornadb-csenl.21"

# Cases the executor runs whose result is a raw `Blob`, which the old pipeline answers
# `ORNA-EVAL-VALUE` because its blob results are ROV3 blob references. The executor's bytes are the
# spec result; the old side is the representation gap. Matches only that exact pair (old
# `ORNA-EVAL-VALUE`, executor `Ok`); any other disagreement stays a mismatch.
[[representation-allowance]]
case = "valid/blob-range.orna"
reason = "the old pipeline answers ORNA-EVAL-VALUE for a raw Blob result (its blob values are ROV3 references, which sys.blob.from_bytes does not produce); the executor returns the canonical bytes the spec defines"
bead = "ornadb-csenl.20"
