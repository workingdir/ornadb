# Differences between the old pipeline and a second pipeline that are accepted.
#
# One `[[difference]]` per accepted difference. A run fails on a difference with
# no entry here and on an entry that no longer differs, so this list only
# shrinks, in the manner of scripts/known-test-failures.toml.
#
# Stage H1 compares the HIR call classification with the evaluator's route trace
# and the HIR resolver with the checker's unresolved/ambiguous answers. Every
# entry below is a measured difference with the stage that closes it:
# `ornadb-csenl.20` (H5, `core.orna`/`sys.orna` declarations and the link step),
# `ornadb-csenl.18` (H3, the checker runs on HIR), and `ornadb-csenl.15` (H0,
# carrying each case's fixture-catalogue environment).

[[difference]]
case = "invalid/duplicate-key.orna"
field = "call-classification"
first = "examples/invalid/duplicate-key.orna@15..29=SourceFunction"
second = "no HIR call"
reason = "the callee is supplied by the fixture-catalogue environment and the case carries no declaration for it, so the HIR program has no call at that span; carrying each case's environment is H0 corpus-fidelity work"
bead = "ornadb-csenl.15"

