[package]
name = "orna-storage-v1"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"
description = "Format-3 publication coordinator and legacy compact readers for Orna"

[features]
# Test-only writers for the retired compact and loose row formats. The shipped
# crate keeps the readers and refuses the retired journals; publication writes
# ORP rows only. Enabled by test crates that need to build a compact base from
# the writer boundary, in the same style as legacy-fixture-writer.
compact-writer-fixtures = []

[dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
orna-foundation-v1 = { path = "../orna-foundation-v1" }
orna-evolution-v1 = { path = "../orna-evolution-v1" }
orna-repository-v1 = { path = "../orna-repository-v1" }
orna-runtime-v1 = { path = "../orna-runtime-v1" }
orna-value-v1 = { path = "../orna-value-v1" }
parquet = { version = "59.3.0", default-features = false, features = ["crc", "zstd"] }
sha2 = "0.10.9"

[dev-dependencies]
# The crate's own integration tests exercise the retired writer boundary, so
# they enable the fixture feature for the library they link against.
orna-storage-v1 = { path = ".", features = ["compact-writer-fixtures"] }
orna-repository-v1 = { path = "../orna-repository-v1", features = ["legacy-fixture-writer"] }
orna-syntax-v1 = { path = "../orna-syntax-v1" }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
