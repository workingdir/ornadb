# The known violations, in the order docs/design/architecture.md Appendix A
# labels them. `--mode=report` prints these with their V number.
[[known]]
id = "V1"
key = "layer:orna-check->orna-sys"
reason = "layer 4 -> 6: the only upward production edge; the catalogue moves to orna-sys-id at layer 3 (stage 06)"

[[known]]
id = "V2"
key = "shipped:orna-cli->orna-conformance"
reason = "R2: the harness is in the shipped binary; the CLI drops it after orna-admission is extracted (stage 10)"

[[known]]
id = "V3"
key = "shipped:orna-conformance->orna-table"
reason = "R2: the oracle table reaches the shipped binary through the harness; merged into orna-conformance (stage 13)"

[[known]]
id = "V4"
key = "tool:orna-traceability->orna-conformance"
reason = "a standalone tool depends on the harness; replaced by the orna-corpus facade"

[[known]]
id = "V-S5-FUSE"
key = "shipped:orna-fuse->orna-conformance"
reason = "the mount's editor commits through the candidate validator in orna-conformance; the same debt as V2 relocated into the shipped closure by the orna-cli split (stage 5)"

[[known]]
id = "V-S5-TESTKIT"
key = "tool:orna-cli-testkit->orna-conformance"
reason = "fixture builders validate candidates through the orna-conformance harness; test-only (stage 5)"

[[known]]
id = "V6"
key = "optional:orna-evaluator->orna-repository"
reason = "R1: optional internal edge; removed by the HostPort trait (stage 05a)"

[[known]]
id = "V7"
key = "optional:orna-evaluator->orna-sys"
reason = "R1: optional internal edge; removed by the HostPort trait (stage 05a)"

[[known]]
id = "V9"
key = "orphan:orna-lsp"
reason = "production in-degree 0 and not declared a tool; the LSP is its own binary"

[[known]]
id = "V10"
key = "orphan:orna-traceability"
reason = "production in-degree 0 and not declared a tool; moves under tools/ with no production dependent"

[[known]]
id = "V13"
key = "orphan:orna-native-loader"
reason = "production in-degree 0 until the evaluator's library-native call path consumes the loader (native-libraries.md section 10 step 2d-f); the loader is called by no analysis tool or language server by design"

[[known]]
id = "V12"
key = "layer:orna-sys-codegen->orna-sys-id"
reason = "owner decision 2026-11-09 (S9): orna-sys-codegen validates semantic role attributes through VersionedId; the zero-dependency identity leaf is both a build and a runtime dependency of the generator"


