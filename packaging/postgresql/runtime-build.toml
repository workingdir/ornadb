format = 1
runtime_identity = "postgresql-18.4-debian12-amd64-orna.1"
prefix = "/usr/lib/orna/postgresql/postgresql-18.4-debian12-amd64-orna.1"
target = "debian12-amd64"
platform = "linux/amd64"
source_date_epoch = 1778528675
builder_image = "docker.io/library/debian@sha256:a1363ada3b45cb3ebc74c78943558f8b0c2b59aaa194d8224e1b02cfd5d78583"
snapshot_timestamp = "20251229T000000Z"
patches = []

[postgresql]
version = "18.4"
url = "https://ftp.postgresql.org/pub/source/v18.4/postgresql-18.4.tar.bz2"
sha256 = "81a81ec695fb0c7901407defaa1d2f7973617154cf27ba74e3a7ab8e64436094"
disabled_by_default = ["ssl", "uuid"]
configure_flags = [
    "--prefix=/usr/lib/orna/postgresql/postgresql-18.4-debian12-amd64-orna.1",
    "--build=x86_64-linux-gnu",
    "--host=x86_64-linux-gnu",
    "--disable-nls",
    "--disable-rpath",
    "--disable-debug",
    "--disable-profiling",
    "--disable-coverage",
    "--disable-dtrace",
    "--disable-tap-tests",
    "--disable-injection-points",
    "--disable-cassert",
    "--without-tcl",
    "--without-perl",
    "--without-python",
    "--without-gssapi",
    "--without-pam",
    "--without-bsd-auth",
    "--without-ldap",
    "--without-bonjour",
    "--without-selinux",
    "--without-systemd",
    "--without-readline",
    "--without-liburing",
    "--without-libcurl",
    "--without-libnuma",
    "--without-libxml",
    "--without-libxslt",
    "--without-lz4",
    "--without-zstd",
    "--without-icu",
    "--without-llvm",
    "--with-zlib",
    "--with-pgport=5432",
    "--with-blocksize=8",
    "--with-segsize=1",
    "--with-wal-blocksize=8",
]

[zlib]
version = "1.3.2"
url = "https://zlib.net/zlib-1.3.2.tar.gz"
sha256 = "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"
build_prefix = "/build/zlib"

[build]
jobs = 1

[build.environment]
AR = "ar"
ARFLAGS = "rcD"
CC = "gcc"
CFLAGS = "-O2 -g0 -fPIC -ffile-prefix-map=/build=. -fdebug-prefix-map=/build=. -Wdate-time"
CONFIG_SITE = "/dev/null"
CPPFLAGS = "-I/build/zlib/include"
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
LDFLAGS = "-L/build/zlib/lib -Wl,-rpath,/build/zlib/lib -Wl,--build-id=none"
PKG_CONFIG_LIBDIR = "/nonexistent"
RANLIB = "ranlib"
TZ = "UTC0"

[host_abi]
architecture = "amd64"
debian = "12"
elf_class = "ELF64"
elf_data = "2's complement, little endian"
elf_machine = "Advanced Micro Devices X86-64"
interpreter = "/lib64/ld-linux-x86-64.so.2"
permitted_unbundled_needed = [
    "libc.so.6",
    "libdl.so.2",
    "libm.so.6",
    "libpthread.so.0",
    "libresolv.so.2",
    "librt.so.1",
    "libutil.so.1",
]

[elf.runpaths]
bin = "$ORIGIN/../lib"
lib = "$ORIGIN"
postgresql = "$ORIGIN/.."

[apt]
sources = [
    "deb http://snapshot.debian.org/archive/debian/20251229T000000Z bookworm main",
    "deb http://snapshot.debian.org/archive/debian/20251229T000000Z bookworm-updates main",
    "deb http://snapshot.debian.org/archive/debian-security/20251229T000000Z bookworm-security main",
]

[apt.packages]
gcc = "4:12.2.0-3"
make = "4.3-4.1"
libc6-dev = "2.36-9+deb12u13"
bison = "2:3.8.2+dfsg-1+b1"
flex = "2.6.4-8.2"
perl = "5.36.0-7+deb12u3"
python3-minimal = "3.11.2-1+b1"
patchelf = "0.14.3-1+b1"
binutils = "2.40-2"
curl = "7.88.1-10+deb12u14"
bzip2 = "1.0.8-5+b1"
ca-certificates = "20230311+deb12u1"
xz-utils = "5.4.1-1"
file = "1:5.44-3"

[archive]
format = "tar.xz"
compression_level = 9
threads = 1
check = "crc64"
