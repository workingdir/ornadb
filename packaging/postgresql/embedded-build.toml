format = 1
identity = "postgresql-18.4-debian12-amd64-orna-embedded.1"
target = "debian12-amd64"
platform = "linux/amd64"
source_date_epoch = 1778528675
builder_image = "docker.io/library/debian@sha256:a1363ada3b45cb3ebc74c78943558f8b0c2b59aaa194d8224e1b02cfd5d78583"
snapshot_timestamp = "20251229T000000Z"
patch = "embedded-postgresql-18.4.patch"
patch_sha256 = "8b3c9c37dcfccece1724183a30508a2e8ff039b4937c615bc22b6f859230a9fc"

[postgresql]
version = "18.4"
url = "https://ftp.postgresql.org/pub/source/v18.4/postgresql-18.4.tar.bz2"
sha256 = "81a81ec695fb0c7901407defaa1d2f7973617154cf27ba74e3a7ab8e64436094"
configure_flags = [
    "--build=x86_64-linux-gnu",
    "--host=x86_64-linux-gnu",
    "--disable-nls",
    "--disable-rpath",
    "--disable-debug",
    "--disable-profiling",
    "--disable-coverage",
    "--disable-dtrace",
    "--disable-tap-tests",
    "--disable-injection-points",
    "--disable-cassert",
    "--without-tcl",
    "--without-perl",
    "--without-python",
    "--without-gssapi",
    "--without-pam",
    "--without-bsd-auth",
    "--without-ldap",
    "--without-bonjour",
    "--without-selinux",
    "--without-systemd",
    "--without-readline",
    "--without-liburing",
    "--without-libcurl",
    "--without-libnuma",
    "--without-libxml",
    "--without-libxslt",
    "--without-lz4",
    "--without-zstd",
    "--without-icu",
    "--without-llvm",
    "--with-zlib",
]

[postgresql_license]
source_path = "COPYRIGHT"
output_path = "POSTGRESQL-LICENSE"
sha256 = "3d6af92ff8a4c2cdf69afb1cf44edea727922f5cd0cf8b5f72b11cdecac8fdfd"

[zlib]
version = "1.3.2"
url = "https://zlib.net/zlib-1.3.2.tar.gz"
sha256 = "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"
build_prefix = "/build/zlib"

[build]
jobs = 1

[build.environment]
AR = "ar"
ARFLAGS = "rcD"
CC = "gcc"
CFLAGS = "-O2 -g0 -fPIC -ffile-prefix-map=/build=. -fdebug-prefix-map=/build=. -Wdate-time"
CONFIG_SITE = "/dev/null"
CPPFLAGS = "-I/build/zlib/include"
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
LDFLAGS = "-L/build/zlib/lib -Wl,--build-id=none"
PKG_CONFIG_LIBDIR = "/nonexistent"
RANLIB = "ranlib"
TMPDIR = "/build/tmp"
TZ = "UTC0"

[static_archive]
path = "liborna_postgres18_backend.a"
member = "liborna_postgres18_backend.o"
entry_symbol = "orna_postgres18_entry"
forbidden_symbols = ["main"]
flattened_inputs = [
    "src/backend object closure excluding src/backend/main/main.o",
    "src/common/libpgcommon_srv.a",
    "src/port/libpgport_srv.a",
    "/build/zlib/lib/libz.a",
]

[resources]
embedded_support_assets = []

[apt]
sources = [
    "deb http://snapshot.debian.org/archive/debian/20251229T000000Z bookworm main",
    "deb http://snapshot.debian.org/archive/debian/20251229T000000Z bookworm-updates main",
    "deb http://snapshot.debian.org/archive/debian-security/20251229T000000Z bookworm-security main",
]

[apt.packages]
bison = "2:3.8.2+dfsg-1+b1"
binutils = "2.40-2"
bzip2 = "1.0.8-5+b1"
ca-certificates = "20230311+deb12u1"
curl = "7.88.1-10+deb12u14"
file = "1:5.44-3"
flex = "2.6.4-8.2"
gcc = "4:12.2.0-3"
libc6-dev = "2.36-9+deb12u13"
make = "4.3-4.1"
patch = "2.7.6-7"
perl = "5.36.0-7+deb12u3"
python3 = "3.11.2-1+b1"
strace = "6.1-0.1"
