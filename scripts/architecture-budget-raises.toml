# Reviewed size exceptions for the OrnaDB workspace.
#
# `python3 scripts/check_architecture.py --mode=budget` fails on a file or
# function that is over its hard cap with no recorded entry and no reviewed
# raise, and on a recorded entry that grows by more than max(5%, 25 lines).
# This file is the only way to permit a deliberate raise; the recorded budget in
# scripts/architecture-budget.toml only ever moves down.
#
# Every entry needs:
#   path       crates/<crate>/<relative file>::<function> for a function,
#              crates/<crate>/<relative file> for a file, or the same forms one
#              level deeper for an archived crate:
#              crates/archive/<crate>/<relative file>[::<function>]
#   new_limit  the reviewed size the path may reach (the same max(5%, 25 lines)
#              tolerance applies above it)
#   reason     why the size is accepted
#   bead       the bead that owns the follow-up work
#
# A raise whose path is not present in the workspace is reserved for an
# in-flight PR and is reported as a note; remove it once the PR lands or the
# code shrinks below the hard cap. A raise that is no longer needed is also a
# note, never a failure; --mode=budget --update removes it automatically.
#
# A pure split that creates over-cap children records each child here with the
# split's bead, while --mode=budget --update lowers the parent's entries. The
# new-debt diagnostic names this escape hatch.

