[[item]]
gate = "E"
id = "E3"
title = "Invalid rows and refinements reject without partial state; the detailed diagnostic and rejected draft remain"
select = [
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_sync_semantics", test = "fsync_acknowledges_valid_draft_and_rejects_invalid_draft" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_sync_semantics", test = "rejected_sync_retains_recoverable_draft_listed_by_id" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_editor_compat", test = "speculative_source_writes_validate_on_sync_and_reject_stale_generation" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_sessions", test = "sigterm_retains_unresolved_drafts_instead_of_discarding_them" },
