[[item]]
gate = "F"
id = "F3"
title = "Resume a migrated stream without resetting its consumer or checkpoint identity"
select = [
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:migration_stream_resume" },
  { record = "workspace-rest", package = "orna-repository-v1", target = "test:git_repository", test = "interrupted_legacy_migration_recovers_without_resetting_the_recorded_consumer_identity" },
]
limitations = ["The stream resumes inside a copy that was never activated, and checkpoints are carried without their unpublished rows (ornadb-5il1.56)."]

[[item]]
gate = "F"
id = "F4"
title = "Reopen new and old mounts simultaneously"
select = [{ record = "workspace-cli", package = "orna-cli-v1", target = "test:mount_readonly_view" }]
limitations = ["No row is read through either mount (ornadb-5il1.192, ornadb-5il1.193)."]

[[item]]
gate = "F"
id = "F5"
title = "With original remotes disabled, rebuild both snapshots from a complete superproject and dependency export with an independent extractor"
select = [
  { record = "workspace-rest", package = "orna-repository-v1", target = "test:complete_copy", test = "complete_copy_reconstructs_both_snapshots_offline_with_an_independent_extractor" },
]
limitations = [
  "Both snapshots are format-3 commits whose store is a text file, and the extractor checks Git object IDs only (ornadb-5il1.193, ornadb-5il1.192).",
]
