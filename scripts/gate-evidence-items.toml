limitations = ["Proven over a real serve process: input 1 + 1 is served as 2, a parse error renders its code, a malformed form value, an unoffered action, an oversize input, a foreign Host and an effectful input are refused with their stable codes, cross-origin and originless POSTs and GET are refused, and a rendered value is escaped. Not proven over HTTP: the busy-session 409 path (unit test `a_busy_console_refuses_the_input_at_once` in orna-cli only, not selected); the Refresh control, which posts the same route and evaluates the query field (ornadb-5il1.494); a project's working tree rather than its committed HEAD (startup-admitted)."]

[[item]]
gate = "G"
id = "G3"
title = "Explicit refresh re-reads the table after a change"
select = [{ record = "workspace-cli", package = "orna-cli", target = "test:devtools_app", test = "devtools_lists_tables_runs_input_and_refreshes" }, { record = "workspace-cli", package = "orna-cli", target = "test:devtools_app", test = "explicit_refresh_shows_a_row_inserted_through_the_repl" }]
limitations = ["Proven: a page request after a REPL insert shows the inserted row and the pre-change page did not. The change is made while the served process is stopped, because a running serve holds the runtime owner lock (ORNA-APP-011); the post-change page is therefore served by a fresh process, not by the process that served the first page. Not proven: an in-process refresh of a running serve after a change made by another writer while it runs (the lock forbids that writer path), and the Refresh control as a click in a browser (ornadb-5il1.494)."]

[[item]]
gate = "G"
id = "G4"
title = "Download and native audio or image rendering over the same production API"
select = [
  { record = "workspace-cli", package = "orna-cli", target = "test:served_image_media", test = "served_image_links_committed_blob_bytes_through_the_media_route" },
  { record = "workspace-cli", package = "orna-cli", target = "test:served_image_media", test = "served_page_reads_a_blob_table_and_a_plain_table_in_one_evaluation" },
  { record = "workspace-cli", package = "orna-cli", target = "test:serve_table_reads", test = "committed_blob_rows_are_served_as_contextual_values" },
  { record = "workspace-cli", package = "orna-cli", target = "test:serve_table_reads", test = "uncommitted_blob_row_is_refused_without_a_value" },
  { record = "workspace-cli", package = "orna-cli", target = "test:served_image_media", test = "served_audio_node_plays_committed_bytes_with_range_and_head" },
  { record = "workspace-cli", package = "orna-cli", target = "test:served_image_media", test = "served_download_node_links_a_committed_blob_as_an_attachment" },
  { record = "workspace-cli", package = "orna-cli", target = "test:served_image_media", test = "served_page_serves_two_blob_tables_each_by_its_own_descriptor" },
]
limitations = ["Proves an image, an audio node and a download node over committed Blobs are served as page nodes whose sources name the committed /media/ route. The route answers the stored bytes, a byte range with 206, and HEAD with the same headers and no body. A payload that is not inline-renderable is an attachment with nosniff and a sandbox. One page reads two Blob tables, and each source is served by its own descriptor. Not proven: browser playback of the audio element and a click on the download link, since no browser runs in these tests; two Blob columns inside one table (ornadb-5il1.495.1.1)."]

[[item]]
gate = "G"
id = "G5"
title = "Console bindings do not alter the page environment"
select = [
  { record = "workspace-rest", package = "orna-application", target = "lib", test = "page_watches_read_the_admitted_module_not_the_console_repl" },
  { record = "workspace-cli", package = "orna-cli", target = "test:devtools_app", test = "console_let_does_not_shadow_the_served_page_environment" },
]
limitations = ["Mutation-proven at the engine seam only: the watch path (orna-application watch_value) reads the admitted page environment, and reading the session REPL there fails page_watches_read_the_admitted_module_not_the_console_repl. The served-page HTTP test console_let_does_not_shadow_the_served_page_environment is a regression guard, not a mutation proof: GET / evaluates the admitted module with a fresh environment under its own lock and has no route from console bindings, so no production mutation of that path exists short of a structural rewrite. Live watches over the socket with console-referenced names are not covered by a test (ornadb-5il1.496)."]

[[item]]
gate = "G"
id = "G6"
title = "An invalid mutation stays invalid from REPL, edit and mount"
select = [{ record = "workspace-cli", package = "orna-cli", target = "test:invalid_mutation_parity", test = "invalid_table_assertion_is_refused_identically_from_repl_edit_and_mount" }, { record = "workspace-cli", package = "orna-cli", target = "test:devtools_app", test = "run_action_refuses_an_invalid_table_mutation_without_writing" }]
limitations = ["The UI leg refuses the mutation (invalid stays invalid) with a different diagnostic identity: the served console answers ORNA-REPL-EFFECT, not the ORNA-A091-009 the REPL and edit legs give, and the served page and stored rows are unchanged. The refusal is the `is_effectful` guard in `orna-evaluator` `admitted_repl.rs` `submit` (the console path through `AdmittedReplSession::submit`); the `orna-application` ORNA-REPL-EFFECT arm is the project `eval_with_transaction` path and is not the guard this test reaches. The writable serve path is not implemented (ornadb-rheqi). The mount leg proves only EINVAL and unchanged row bytes, since the mount channel carries no diagnostic code. Untested mappings: the three rename-over temporary-save rejections in fuse_mount.rs, and the REPL external-binding refusal in main.rs (table_activation_cause, reached only when an external binding dispatched); no test reaches either with a false assertion. Only the table-assertion class is exercised."]

[[item]]
gate = "G"
id = "G7"
title = "CSS removal leaves usable native controls"
select = [{ record = "workspace-cli", package = "orna-cli", target = "bin:orna", test = "renders_text_field_button_and_input_as_native_controls" }, { record = "workspace-cli", package = "orna-cli", target = "test:devtools_app", test = "native_controls_submit_the_served_page_without_a_stylesheet" }]
limitations = ["The served page never links a stylesheet, so the removal is checked as an absence in a real `orna serve` process rather than by deleting a link. The submit is a plain HTTP POST built from the served form's action and input name; no browser engine executes the click, so the button's native activation is not exercised (ornadb-5il1.497)."]

[[item]]
