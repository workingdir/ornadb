# Acceptance gate items recorded by the nightly gates workflow.
#
# `scripts/gate_evidence.py summarize` resolves every item below against the
# records the nightly jobs write, and reports it as passed, failed,
# not-executed or unavailable (implementation/ACCEPTANCE.md, "Evidence record
# per gate"). An item is passed only when its selected tests ran and passed. A
# gate is passed only when every item passed and no item lists a limitation.
#
# Items cover the mandatory gates A-G of the repository-engine-1.1 and
# vfs-linux-v1 profiles, Orna 1.1.0 Gate G and Orna 1.1.0 Gate H. Gate G's
# paragraph in implementation/ACCEPTANCE.md is unnumbered; items G1-G9 number its
# clauses in order (table list, Run, refresh, download or rendering, console
# bindings, invalid mutation, CSS removal, devtools removal, second app). Gate
# H's paragraph is unnumbered too; items H1-H9 cover its clauses.
# Selectors pick tests from records:
#   record  record ID or glob (default: every record)
#   package Cargo package
#   target  lib, doc, bin:NAME, test:NAME or check:NAME
#   test    exact libtest name, or its final path segments
#   prefix  libtest name prefix
# Limitations say what the selected tests do not show; each names the bead that
# owns the gap. Remove a limitation in the change that closes it.

[publication]
version = "1.1.0"
revision = "final-2026-10-05"
archive_sha256 = "fe4a35dc81c2c2994e0a18d7c7931ea0bbd298ab23248496cbe880f264c5db56"

[records]
expected = [
  "workspace-cli",
  "workspace-evaluator",
  "workspace-sys",
  "workspace-rest",
  "gate-d-crash-matrix",
  "claims-fixed-row-batching",
  "claims-prune-expire",
  "claims-retired-row-writers",
  "gate-c-million-rows",
  "gate-h-browser-wasm",
]

# Gate A: format and existing behaviour.

[[item]]
gate = "A"
id = "A1"
title = "Retain original source, mutation, assertion, effect and codec tests"
select = [{ record = "workspace-*" }]
limitations = [
  "Some conformance tests pin failing valid fixtures as expected outcomes, so their pass does not show conformance (ornadb-5il1.146).",
]

[[item]]
gate = "A"
id = "A2"
title = "New format has exactly one writer"
select = [
  { record = "workspace-cli", package = "orna-cli", target = "test:publish_format3_orp_only" },
  { record = "claims-retired-row-writers", package = "workspace", target = "check:retired-row-writers" },
]
limitations = [
  "The select shows publication writes ORP rows, and a legacy HEAD is refused before any freeze (publish_legacy_read_only), and scripts/check_retired_row_writers.sh fails the nightly when the shipped crate carries a retired writer symbol: it requires the guarded build to expose the writer entry points and the default build to expose none, so an ungated writer fails the check, and an unreadable symbol table fails it too rather than passing quietly. The retired compact writer boundary is now compiled out of the shipped crate: its mutation, input, row and batch types, the freeze lowering, fold, consume, apply and migration-plan entry points, and their imports all sit behind the compact-writer-fixtures feature, which only test crates enable. The default-feature rlib carries no apply_writer_input or prepare_writer_batch symbol (18 with the feature, 0 without, checked by hand). The loose writer is already gone from the crate, which keeps only the loose and compact readers and the journal refusals (ornadb-5il1.99). ",
]

[[item]]
gate = "A"
id = "A3"
title = "Unknown and mixed formats fail early"
