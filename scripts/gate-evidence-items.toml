  { record = "gate-d-crash-matrix", package = "orna-cli", target = "test:publication_crash_matrix", test = "cli_publication_reopens_after_process_kill_at_each_reachable_boundary" },
  { record = "gate-d-crash-matrix", package = "orna-cli", target = "test:publication_crash_matrix", test = "capture_and_row_commit_recover_after_process_kill" },
  { record = "workspace-rest", package = "orna-runtime", target = "test:durable_crash_recovery" },
]
counters = ["recovery_publish_exit="]

[[item]]
gate = "D"
id = "D2"
title = "After restart no acknowledged row lacks bytes, no action repeats, no later tail is consumed, no unrelated staged or unstaged file is lost and no abandoned owner keeps write permission"
select = [
  { record = "gate-d-crash-matrix", package = "orna-cli", target = "test:publication_crash_matrix", test = "recovery_consumes_only_frozen_range_and_preserves_unrelated_work" },
  { record = "gate-d-crash-matrix", package = "orna-cli", target = "test:publication_crash_matrix", test = "cli_publication_reopens_after_process_kill_at_each_reachable_boundary" },
  { record = "gate-d-crash-matrix", package = "orna-cli", target = "test:publication_crash_matrix", test = "capture_and_row_commit_recover_after_process_kill" },
  { record = "workspace-rest", package = "orna-runtime", target = "test:owner_fence_gate_d" },
  { record = "workspace-cli", package = "orna-cli", target = "test:live_owner_fence", test = "paused_live_owner_refuses_outside_publish_until_it_exits" },
]
limitations = [
  "Dead owners are fenced after real SIGKILL of a lease-holding child (owner_fence_gate_d.rs). A paused live owner is refused at `orna publish` by the runtime owner lock, and the outside publish changes nothing until the owner exits (live_owner_fence.rs). Publication entry points below the CLI (freeze, complete_publication) still carry no owner check, and a takeover of a live owner is not exercised because the flock is held by the live process (ornadb-5il1.127, ornadb-5il1.58).",
]

