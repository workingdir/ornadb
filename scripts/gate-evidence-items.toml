  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_projection_features", test = "key_over_300_characters_is_admitted_and_projects_as_alias" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_projection_features", test = "large_str_projects_as_txt_and_utf8_write_replaces_the_str" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_projection_features", test = "large_str_bound_is_exclusive_at_64_kib" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_cases", test = "multi_file_source_edit_requires_grouped_validation" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_cases", test = "vfs_020_source_module_group_is_admitted_together_or_not_at_all" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_editor_compat", test = "editor_mount_refuses_chmod_and_chown_with_eperm" },
