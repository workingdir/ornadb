# Gate C: indexed rows at scale.

[[item]]
gate = "C"
id = "C1"
title = "Ten and one million rows use ORP-1"
select = [
  { record = "workspace-rest", package = "orna-repository", target = "test:row_store_scale", test = "orp1_production_writer_ten_rows" },
  { record = "gate-c-million-rows", package = "orna-repository", target = "test:row_store_scale", test = "orp1_row_store_one_million_rows" },
]
counters = ["^ORP-1 production_writer "]

[[item]]
gate = "C"
id = "C2"
title = "Indexed point and range queries, missing keys, unindexed scan and concurrent writes in cold and warm partial clones"
select = [
  { record = "workspace-rest", package = "orna-repository", target = "test:row_store_scale", test = "orp1_row_store_ten_rows" },
  { record = "workspace-cli", package = "orna-cli", target = "test:partial_clone_publication_race" },
  { record = "workspace-rest", package = "orna-repository", target = "test:row_store_scale", test = "orp1_production_publication_race" },
  { record = "gate-c-million-rows", package = "orna-repository", target = "test:row_store_scale", test = "orp1_row_store_one_million_rows" },
]
limitations = [
  "Concurrent publication is raced three ways: two publishers on one local repository (orp1_production_publication_race), and a cold and a warm partial clone that each publish their own row and then race the push to a shared bare remote (partial_clone_publication_race). The clone race asserts one push wins, the remote branch reaches only the winner commit, a fresh product reader over the remote reads the winner row and not the loser row, and the losing clone keeps its own publication as a local commit after fetching the published snapshot. It does not merge the two publications: both rewrite one store file and the format has no merge rule for two publications of one store. Still not covered: exercise_concurrent_writes computes the row index on two threads without publishing, so it does not race two publications. That driver now runs nightly, because the ignored one-million-row case runs in the nightly gates job and C2 selects its record; what it does not do is publish concurrently, which the two race tests above cover on their own (ornadb-mmsa.13).",
]

[[item]]
gate = "C"
id = "C3"
title = "Report root and tree traffic, payload traffic, latency, allocations and indices"
select = [
  { record = "workspace-rest", package = "orna-repository", target = "test:row_store_scale", test = "orp1_row_store_ten_rows" },
  { record = "workspace-rest", package = "orna-repository", target = "test:row_store_scale", test = "orp1_production_writer_ten_rows" },
  { record = "gate-c-million-rows", package = "orna-repository", target = "test:row_store_scale", test = "orp1_row_store_one_million_rows" },
]
counters = ["^ORP-1 "]
limitations = [
  "The traffic, latency, allocation and index counters come from the test-side ORP-1 fixture: orp1_row_store_ten_rows, and now orp1_row_store_one_million_rows, whose record carries the aggregate ORP-1 counter line (for example rows=1000000 leaves=12958 branches=163 index_churn=13121, with cold and warm point, range, missing-key and scan timings). orp1_production_writer_ten_rows now reports latency and allocation counters for a production-written graph as well (publish_us, publish_allocations, publish_bytes, read_us, read_allocations, read_bytes, measured around the publication and around the read), so the traffic, latency and allocation figures are no longer fixture-only at ten rows. What remains unmeasured is a production-written graph at one million rows (ornadb-5il1.6).",
]

[[item]]
gate = "C"
id = "C4"
title = "Prepend, delete, rekey and large-row cases measure index churn separately from media reuse"
select = [
  { record = "workspace-rest", package = "orna-repository", target = "test:row_store_scale", test = "orp1_row_store_ten_rows" },
  { record = "workspace-rest", package = "orna-repository", target = "test:row_store_scale", test = "orp1_index_churn_multi_page" },
  { record = "gate-c-million-rows", package = "orna-repository", target = "test:row_store_scale", test = "orp1_row_store_one_million_rows" },
]
counters = ["^ORP-1 index_churn "]
limitations = [
  "The large row is a 7.7 KB inline row. The harness measures an overflowing row on the write side only: a maintenance pass rewrites the graph it was handed, so reading the new root back needs the relation record pointed at the successor root, which this harness does not do. The read path itself is covered elsewhere: large_row_publish_e2e::a_row_over_8_kib_publishes_through_the_overflow_graph queries the published row by key and by diff, and format_context::pinned_orp_loader_issues_lazy_snapshot_and_reads_verified_overflow_by_point_and_range reads a verified overflow row by point and by range without fetching payload bytes.",
]

[[item]]
