  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_sync_semantics", test = "rejected_candidates_with_identical_bytes_retain_distinct_draft_ids" },
  { record = "workspace-cli", package = "orna-cli", target = "test:edit_cli", test = "edit_row_rejection_reports_diagnostic_and_retains_distinct_drafts" },
  { record = "workspace-cli", package = "orna-cli", target = "test:edit_cli", test = "edit_row_default_output_names_retained_draft" },
]
limitations = ["The rejected candidate is kept by the unmount-time retain request, and the tests assert the listed draft id names a retained record holding the exact candidate bytes (profiles/vfs-1.md:101-102). rejected_candidates_with_identical_bytes_retain_distinct_draft_ids covers the unique-ID clause on two rows whose rejected documents are byte-identical: the ids differ, each record's header names its own projected path, and a second retain keeps each first record. The SIGTERM selector shows unresolved drafts are retained in general, not that the rejected candidate specifically is. edit_row_rejection_reports_diagnostic_and_retains_distinct_drafts drives the production orna edit --row entrypoint with --debug; it proves the admission reason and draft path are reported and that two byte-identical rejected candidates keep distinct draft records. edit_row_default_output_names_retained_draft drives the same entrypoint without --debug and proves the default error title names the retained draft path (ORNA-UX-004 requires the recovery location; the admission cause stays behind --debug). Not covered: the default-mode title for the stale-baseline refusal (EditError::Stale), and no command resubmits a retained draft, so the recovery help line is an instruction to edit the row again."]

[[item]]
