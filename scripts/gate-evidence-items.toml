[[item]]
gate = "E"
id = "E9"
title = "Kernel caching does not leak private drafts into another handle or generation"
select = [
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_isolation", test = "unsynced_draft_is_invisible_to_second_open_and_after_child_exec_and_sigkill_remount" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_isolation", test = "repeated_observer_reads_never_show_private_draft_and_read_handles_pin_generation" },
  { record = "workspace-cli", package = "orna-cli", target = "bin:orna", test = "editor_open_flags_bypass_kernel_cache_without_writeback_capability" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_integration", test = "cwd_mount_read_only_blob_opens_share_no_cached_pages_across_generations" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_isolation", test = "read_only_text_opens_share_no_cached_pages_across_generations" },
]
limitations = ["Mount-level selectors above are claimed. read_only_text_opens_share_no_cached_pages_across_generations and cwd_mount_read_only_blob_opens_share_no_cached_pages_across_generations carry the page-cache clause of profiles/vfs-1.md:129-130 for the Text and Blob shapes: their read-only opens reply with FopenFlags::empty(), so the kernel caches their pages. Each test checks that a same-length replacement gets a fresh inode, that read-only opens return the replacement bytes, and that a pinned handle keeps the captured generation. They observe the bytes and inode a mount serves, not the kernel page cache itself. Mutation results (ornadb-mhm7i; one production edit at a time in fuse_mount.rs, each reverted and checked against origin/main): (A) the replacement reuses the superseded inode number in replace_blob_generation: the Blob test fails at its freshness assertion (vfs_mount_integration.rs:4039, exit 101) and the Text test fails at its freshness assertion (vfs_mount_isolation.rs:598, exit 101). (B) read-only Blob and Text replies set FOPEN_KEEP_CACHE with fresh inodes: both page-cache tests still pass (exit 0), because a fresh inode is never answered from the superseded generation's pages, so KEEP_CACHE alone is not a stale-read regression and no behaviour selector can detect it. (C) B and A together: the Blob test fails at its freshness assertion (exit 101), and the Text test fails earlier at its content assertion (vfs_mount_isolation.rs:593, exit 101) because it reads the superseded bytes, so the stale read is observed. Remaining gap: the bin:orna selector checks only the editable open flags, not the read-only replies; a flags-level assertion on the read-only reply is not added, since it would couple the test to the reply flag rather than to the visible behaviour. The mount never rewrites a committed inode in place, so a stale-page regression on an unchanged inode is not reachable through a mount test here. The row document itself is not a page-cached case: every document open requests FOPEN_DIRECT_IO (EDITABLE_OPEN_FLAGS), so the reused document inode cannot share pages across generations. The bin:orna selector is a constant check of the editable open flags and init capabilities (fuse_mount.rs), not an observation of kernel caching through a mount; it is named here, not counted as mount-level evidence (ornadb-5il1.64)."]

