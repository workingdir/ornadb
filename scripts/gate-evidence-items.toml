# Acceptance gate items recorded by the nightly gates workflow.
#
# `scripts/gate_evidence.py summarize` resolves every item below against the
# records the nightly jobs write, and reports it as passed, failed,
# not-executed or unavailable (implementation/ACCEPTANCE.md, "Evidence record
# per gate"). An item is passed only when its selected tests ran and passed. A
# gate is passed only when every item passed and no item lists a limitation.
#
# Items cover the mandatory gates A-F of the repository-engine-1.1 and
# vfs-linux-v1 profiles. Selectors pick tests from records:
#   record  record ID or glob (default: every record)
#   package Cargo package
#   target  lib, doc, bin:NAME, test:NAME or check:NAME
#   test    exact libtest name, or its final path segments
#   prefix  libtest name prefix
# Limitations say what the selected tests do not show; each names the bead that
# owns the gap. Remove a limitation in the change that closes it.

[publication]
version = "1.1.0"
revision = "final-2026-10-05"
archive_sha256 = "fe4a35dc81c2c2994e0a18d7c7931ea0bbd298ab23248496cbe880f264c5db56"

[records]
expected = [
  "workspace-cli",
  "workspace-evaluator",
  "workspace-sys",
  "workspace-rest",
  "gate-d-crash-matrix",
  "lint-fmt",
  "lint-clippy",
]

# Gate A: format and existing behaviour.

[[item]]
gate = "A"
id = "A1"
title = "Retain original source, mutation, assertion, effect and codec tests"
select = [{ record = "workspace-*" }]
limitations = [
  "Some conformance tests pin failing valid fixtures as expected outcomes, so their pass does not show conformance (ornadb-5il1.146).",
]

[[item]]
gate = "A"
id = "A2"
title = "New format has exactly one writer"
select = [{ record = "workspace-cli", package = "orna-cli-v1", target = "test:publish_format3_orp_only" }]
limitations = [
  "Shows only that publication writes ORP rows; no test asserts that the compact and loose writers are unreachable (ornadb-5il1.111, ornadb-5il1.99).",
]

[[item]]
gate = "A"
id = "A3"
title = "Unknown and mixed formats fail early"
select = [
  { record = "workspace-rest", package = "orna-repository-v1", target = "test:format_context", test = "fails_closed_on_unknown_mixed_malformed_and_unavailable_metadata" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:migration_copy_cli", test = "cli_migration_copy_rejects_mixed_worktree_metadata" },
]
limitations = ["Real 1.0 records are rejected as malformed rather than read (ornadb-5il1.191)."]

[[item]]
gate = "A"
id = "A4"
title = "Old commits decode under old rules"
limitations = [
  "No test decodes a legacy commit; the CLI tests assert that an invented format-1 marker is refused (ornadb-5il1.192, ornadb-5il1.191).",
]

[[item]]
gate = "A"
id = "A5"
title = "Blob annotations, equality and legacy protocol rejection agree across schema, runtime, export and reflection"
select = [
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:legacy_protocol_rejection" },
  { record = "workspace-sys", package = "orna-sys-v1", target = "test:sys_reflection_schema_conformance" },
  { record = "workspace-evaluator", package = "orna-evaluator-v1", target = "test:evaluator_ovb2_boundary" },
]
limitations = [
  "Runtime and export report different rejection codes for the same value (ornadb-5il1.98, ornadb-5il1.100).",
]

[[item]]
gate = "A"
id = "A6"
title = "MIME normalization and hints match profile vectors"
select = [{ record = "workspace-rest", package = "orna-value-v1", target = "lib", prefix = "mime1::tests::" }]

[[item]]
gate = "A"
id = "A7"
title = "Required source and row identities survive ordinary rename and rekey"
select = [{ record = "workspace-cli", package = "orna-cli-v1", target = "test:object_identity_mv" }]
limitations = [
  "Identities live in a tracked sidecar and loose row directories that the format-3 layout forbids, and no production path issues them into a fresh store (ornadb-5il1.117).",
]

# Gate B: actual data path. B1-B3 are evidence from the nightly workspace-cli record
# (nightly-gates.yml, cli shard, `run` with a 330-minute budget, no per-test skip). The
# per-PR cli-tests job skips this test (--skip-test) and cli-gate-b.yml runs it without
# writing an evidence record, so neither per-PR nor cli-gate-b counts toward B1-B3.

[[item]]
gate = "B"
id = "B1"
title = "Two small media fixtures and one 10 GB high-entropy fixture import with bounded RSS and temporary storage"
select = [
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:media_import_query", test = "gate_b_streams_large_network_payload_with_bounded_rss_and_zero_read_metadata" },
]
counters = ["^Gate B: "]
limitations = [
  "The 10 GiB payload goes through the repository capture seam into a hand-built store, not through the production import (ornadb-5il1.120, ornadb-5il1.117).",
]

[[item]]
gate = "B"
id = "B2"
title = "Record peak RSS, bytes read and written, network objects and elapsed time"
select = [
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:media_import_query", test = "gate_b_streams_large_network_payload_with_bounded_rss_and_zero_read_metadata" },
]
counters = ["^Gate B: "]
limitations = ["The test prints `remote Git objects=0` as a literal rather than a measurement (ornadb-5il1.8)."]

[[item]]
gate = "B"
id = "B3"
title = "Title, MIME and hint-only update, row lookup and summary read touch zero media-payload bytes; metadata counted separately"
select = [
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:media_import_query", test = "gate_b_streams_large_network_payload_with_bounded_rss_and_zero_read_metadata" },
]
limitations = [
  "There is no title-only update, metadata bytes are not reported, and the zero-read checks cannot see the commit or publish path (ornadb-5il1.8).",
]

[[item]]
gate = "B"
id = "B4"
title = "Seek and range reads verify bytes and report whole-object overfetch"
select = [{ record = "workspace-rest", package = "orna-repository-v1", target = "lib", test = "range_reads_report_whole_chunk_overfetch_against_requested_bytes" }]
counters = ["^Gate B: range "]

[[item]]
gate = "B"
id = "B5"
title = "Full export verifies raw hashes"
select = [{ record = "workspace-cli", package = "orna-cli-v1", target = "test:complete_copy_export" }]
limitations = [
  "The Blob's raw SHA-256 is not recomputed against its descriptor, and the 10 GiB row is never exported (ornadb-5il1.193).",
]

[[item]]
gate = "B"
id = "B6"
title = "Binary edit rehash cost is measured rather than hidden"
limitations = ["No test measures rehash cost."]

# Gate C: indexed rows at scale.

[[item]]
gate = "C"
id = "C1"
title = "Ten and one million rows use ORP-1"
select = [
  { record = "workspace-rest", package = "orna-repository-v1", target = "test:row_store_scale", test = "orp1_row_store_ten_rows" },
]
counters = ["^ORP-1 "]
limitations = [
  "The row graph comes from a test-side ORP-1 encoder, not the production writer (ornadb-5il1.6, ornadb-5il1.129).",
  "C1-C4 select the ten-row test only: the one-million-row case runs in gate-c-scale.yml (PR 9344, bead ornadb-5il1.373), which this workflow does not read (ornadb-5il1.6).",
]

[[item]]
gate = "C"
id = "C2"
title = "Indexed point and range queries, missing keys, unindexed scan and concurrent writes in cold and warm partial clones"
select = [
  { record = "workspace-rest", package = "orna-repository-v1", target = "test:row_store_scale", test = "orp1_row_store_ten_rows" },
]
limitations = [
  "The concurrent writes compute the row index on two threads; nothing commits and no ref CAS race occurs (ornadb-mmsa.13).",
]

[[item]]
gate = "C"
id = "C3"
title = "Report root and tree traffic, payload traffic, latency, allocations and indices"
select = [
  { record = "workspace-rest", package = "orna-repository-v1", target = "test:row_store_scale", test = "orp1_row_store_ten_rows" },
]
counters = ["^ORP-1 "]
limitations = ["The counters measure the test-side ORP-1 fixture, not graphs written by the production writer (ornadb-5il1.6)."]

[[item]]
gate = "C"
id = "C4"
title = "Prepend, delete, rekey and large-row cases measure index churn separately from media reuse"
select = [
  { record = "workspace-rest", package = "orna-repository-v1", target = "test:row_store_scale", test = "orp1_row_store_ten_rows" },
]
counters = ["^ORP-1 index_churn "]
limitations = [
  "The large row is a 7.7 KB inline row with no overflow, and index maintenance rebuilds the whole table (ornadb-5il1.129).",
]

[[item]]
gate = "C"
id = "C5"
title = "Malformed overlapping ranges, broken counts, giant fanout and wrong schema domains fail"
select = [
  { record = "workspace-rest", package = "orna-repository-v1", target = "test:row_store_scale", test = "orp1_malformed_graphs_report_specific_diagnostics" },
]

[[item]]
gate = "C"
id = "C6"
title = "Do not claim fixed-row batching is content-stable"
limitations = ["A documentation obligation with no executable check."]

# Gate D: durability and publication.

[[item]]
gate = "D"
id = "D1"
title = "Fault injection or SIGKILL at each capture, pack install, pin, row commit, private candidate, ref CAS, index reconcile and tail cleanup boundary"
select = [
  { record = "gate-d-crash-matrix", package = "orna-cli-v1", target = "test:publication_crash_matrix", test = "cli_publication_reopens_after_process_kill_at_each_reachable_boundary" },
  { record = "gate-d-crash-matrix", package = "orna-cli-v1", target = "test:publication_crash_matrix", test = "capture_and_row_commit_recover_after_process_kill" },
  { record = "workspace-rest", package = "orna-runtime-v1", target = "test:durable_crash_recovery" },
]
counters = ["recovery_publish_exit="]

[[item]]
gate = "D"
id = "D2"
title = "After restart no acknowledged row lacks bytes, no action repeats, no later tail is consumed, no unrelated staged or unstaged file is lost and no abandoned owner keeps write permission"
select = [
  { record = "gate-d-crash-matrix", package = "orna-cli-v1", target = "test:publication_crash_matrix", test = "recovery_consumes_only_frozen_range_and_preserves_unrelated_work" },
  { record = "gate-d-crash-matrix", package = "orna-cli-v1", target = "test:publication_crash_matrix", test = "cli_publication_reopens_after_process_kill_at_each_reachable_boundary" },
  { record = "gate-d-crash-matrix", package = "orna-cli-v1", target = "test:publication_crash_matrix", test = "capture_and_row_commit_recover_after_process_kill" },
  { record = "workspace-rest", package = "orna-runtime-v1", target = "test:owner_fence_gate_d" },
]
limitations = [
  "Owner fencing is shown only after the test calls takeover_lease itself; live writers are not fenced (ornadb-5il1.127, ornadb-5il1.58).",
]

[[item]]
gate = "D"
id = "D3"
title = "Exercise coordinated GC/repack and captured external edits"
select = [
  { record = "gate-d-crash-matrix", package = "orna-cli-v1", target = "test:publication_crash_matrix", test = "coordinated_gc_prune_keeps_pinned_objects_and_removes_unreferenced_ones" },
  { record = "gate-d-crash-matrix", package = "orna-cli-v1", target = "test:publication_crash_matrix", test = "format3_publication_recovers_when_gc_prunes_candidate_before_publish" },
]
limitations = ["No Orna-coordinated maintenance operation exists; the tests run git gc directly (ornadb-5il1.58, ornadb-20ac)."]

[[item]]
gate = "D"
id = "D4"
title = "No production claim of arbitrary concurrent uncoordinated git prune --expire now"
limitations = ["A documentation obligation with no executable check."]

[[item]]
gate = "D"
id = "D5"
title = "Recovery of uncertain external effects never fabricates proven rollback"
select = [
  { record = "workspace-rest", package = "orna-runtime-v1", target = "lib", test = "external_effect_marker_keeps_fault_recovery_uncertain" },
  { record = "workspace-rest", package = "orna-runtime-v1", target = "lib", test = "legacy_running_request_recovers_as_uncertain_after_takeover" },
  { record = "workspace-rest", package = "orna-runtime-v1", target = "lib", test = "recovery_retains_uncertainty_and_clears_old_owner_evidence" },
]
limitations = ["Library tests only; no process-kill test covers uncertain effects (ornadb-5il1.59)."]

# Gate E: actual writable mount. The workspace-cli record runs with ORNA_REQUIRE_FUSE=1.

[[item]]
gate = "E"
id = "E1"
title = "Supported in-place and temp/rename editors run; editor, kernel and libfuse versions and save settings are recorded"
select = [{ record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_editor_compat" }]
limitations = [
  "Save settings are fixed in the test; editor, kernel and libfuse versions come from the workspace-cli record's tool versions (ornadb-5il1.9).",
]

[[item]]
gate = "E"
id = "E2"
title = "Media player plus binary export and replacement"
select = [
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_integration", test = "cwd_mount_replace_content_updates_blob_descriptor_and_preserves_row_identity" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_integration", test = "cwd_mount_wav_blob_row_plays_through_seek_reads_and_exports_byte_for_byte" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:edit_cli" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_media_reader" },
]
limitations = ["The mpv leg runs only where mpv is installed; CI installs it and sets ORNA_REQUIRE_MEDIA_PLAYER=1, which makes a missing mpv a failure. One player is exercised, not a player matrix (ornadb-5il1.62)."]

[[item]]
gate = "E"
id = "E3"
title = "Invalid rows and refinements reject without partial state; the detailed diagnostic and rejected draft remain"
select = [
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_sync_semantics", test = "fsync_acknowledges_valid_draft_and_rejects_invalid_draft" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_sync_semantics", test = "rejected_sync_retains_recoverable_draft_listed_by_id" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_editor_compat", test = "speculative_source_writes_validate_on_sync_and_reject_stale_generation" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_sessions", test = "sigterm_retains_unresolved_drafts_instead_of_discarding_them" },
]
limitations = ["The rejected candidate is kept by the unmount-time retain request, and the test asserts the listed draft id names a retained record holding the exact candidate bytes (profiles/vfs-1.md:101-102). The SIGTERM selector shows unresolved drafts are retained in general, not that the rejected candidate specifically is. The orna edit --row draft admission and report path is not covered by this item (ornadb-5il1.140)."]

[[item]]
gate = "E"
id = "E4"
title = "fsync/fdatasync, repeated flush, dup/fork, temp sync/rename, writes after sync, zero truncation, sparse holes, quota exhaustion and close-error ignorance"
select = [
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_sync_semantics" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_truncate_sparse" },
]
limitations = ["fork is simulated with an inherited handle and close(2) errors are not observed (ornadb-5il1.60, ornadb-5il1.61)."]

[[item]]
gate = "E"
id = "E5"
title = "Concurrent REPL changes against captured file-write baselines and strong orna edit read baselines"
select = [
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_integration", test = "cwd_mount_save_after_another_writer_advances_head_is_stale" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:edit_cli" },
]
limitations = ["No live REPL runs alongside a mount, and the workspace mount is not the CWD (ornadb-5il1.64)."]

[[item]]
gate = "E"
id = "E6"
title = "Demonstrate blind replacement's limitation"
select = [{ record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_isolation", test = "blind_replacement_after_late_temp_overwrites_owner_change_while_orna_edit_refuses" }]
limitations = ["The test pins the blind replacement as current behaviour; it demonstrates the limitation and is not a protection. The protected path is orna edit (profiles/vfs-1.md:118-119). The orna edit refusal is asserted as E2000 with the stale detail and the retained-draft help line. [INFERENCE] from reading fuse_mount.rs:3893: the spec cause sys.vfs.stale_edit (Orna-1.1.0.md:8674) is not in this command's output or in the mount's unresolved-draft fields for this path; the test does not assert that absence."]

[[item]]
gate = "E"
id = "E7"
title = "Open reads remain on old content after replacement"
select = [
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_isolation", test = "read_handle_opened_before_temp_rename_keeps_old_bytes" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_isolation", test = "reader_opened_before_owner_write_keeps_old_bytes" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_integration", test = "cwd_mount_open_blob_handle_keeps_captured_generation_across_replacement" },
]
limitations = ["Covers rename-over and owner-write replacement through the mount; other replacement shapes have no selector for this item."]

[[item]]
gate = "E"
id = "E8"
title = "Schema changes, renamed MIME suffix, key and namespace collisions, long and composite keys (empty keys: test ignored, ornadb-5il1.462.1), nested collections, large Str, multi-file source edits, permissions and unsupported operations"
select = [
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_integration", test = "cwd_mount_save_after_head_renames_table_keeps_pinned_declaration" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_unsupported_ops" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_editor_compat", test = "editor_mount_rejects_unsupported_links_devices_and_shared_mmap" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_projection_features", test = "reserved_key_components_escape_first_byte" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_projection_features", test = "reserved_spelling_beyond_vfs_1_text_is_conservative" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_composite_key_mount", test = "composite_key_components_project_as_nested_directories" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_projection_features", test = "profile_nested_collection_directories_follow_the_module_path" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_projection_features", test = "nested_record_and_list_fields_project_as_pinned_directories" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_projection_features", test = "long_key_over_200_encoded_bytes_projects_as_sha256_key_alias" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_projection_features", test = "key_over_300_characters_is_admitted_and_projects_as_alias" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_projection_features", test = "large_str_projects_as_txt_and_utf8_write_replaces_the_str" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_projection_features", test = "large_str_bound_is_exclusive_at_64_kib" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_cases", test = "multi_file_source_edit_requires_grouped_validation" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_cases", test = "vfs_020_source_module_group_is_admitted_together_or_not_at_all" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_editor_compat", test = "editor_mount_refuses_chmod_and_chown_with_eperm" },
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_integration", test = "cwd_mount_chmod_of_document_fails_eperm_without_row_change" },
]
limitations = ["Only the selectors above are claimed. Reserved-name escapes beyond the literal profiles/vfs-1.md:46 text are a conservative, spec-silent selector, not a spec requirement. Not covered: empty keys (test ignored: vfs_projection_features 'empty text key cannot be stored', ornadb-5il1.462.1); namespace collisions have no selector; schema change is covered only for a head table rename; the composite-key selector is one fixture; grouped source edits do not assert no-evaluation during speculative writes (ORNA-VFS-020 proper, ornadb-9npn) (ornadb-5il1.63)."]

[[item]]
gate = "E"
id = "E9"
title = "Kernel caching does not leak private drafts into another handle or generation"
