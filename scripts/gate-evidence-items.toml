id = "E8"
title = "Schema changes, renamed MIME suffix, key and namespace collisions (reserved data.orna / Blob data+orna collision only), long and composite keys (empty keys: test ignored, ornadb-5il1.462.1), nested collections, large Str, multi-file source edits, permissions and unsupported operations"
