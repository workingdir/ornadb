  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_integration", test = "cwd_mount_blob_suffix_round_trip_keeps_bytes" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_integration", test = "cwd_mount_blob_field_data_with_orna_suffix_escapes_beside_row_document" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_paths", test = "data_orna_key_escapes_first_byte_and_round_trips" },
]
limitations = ["Only the selectors above are claimed. Reserved-name escapes beyond the literal profiles/vfs-1.md:46 text are a conservative, spec-silent selector, not a spec requirement. Namespace collisions are claimed only for the Blob field data with suffix orna (projects as %64ata.orna beside the row document data.orna, exact-path resolution only) and the row key data.orna; other generated-collision spellings have no selector here. The renamed MIME suffix clause is carried by the two Blob suffix-rename selectors: a compatible suffix moves only the descriptor's suffix hint and keeps the bytes, an incompatible one is refused with EPERM, and a suffix round trip keeps the bytes. Schema change is carried by the vfs_019 live-mount selectors: head table rename, field add and retype at head, field removal by owner commit, a default frozen at introduction, stale generation saves and refused commits. Not covered: empty keys (test ignored: vfs_projection_features 'empty text key cannot be stored', ornadb-5il1.462.1); a field rename has no live-mount selector (it is reachable only through the LSP rename path); the composite-key selector is one fixture; grouped source edits do not assert no-evaluation during speculative writes (ORNA-VFS-020 proper, ornadb-9npn) (ornadb-5il1.63)."]

[[item]]
gate = "E"
id = "E9"
title = "Kernel caching does not leak private drafts into another handle or generation"
select = [
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_isolation", test = "unsynced_draft_is_invisible_to_second_open_and_after_child_exec_and_sigkill_remount" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_isolation", test = "repeated_observer_reads_never_show_private_draft_and_read_handles_pin_generation" },
  { record = "workspace-cli", package = "orna-cli", target = "bin:orna", test = "editor_open_flags_bypass_kernel_cache_without_writeback_capability" },
  { record = "workspace-cli", package = "orna-cli", target = "test:vfs_mount_isolation", test = "read_only_text_opens_share_no_cached_pages_across_generations" },
]
limitations = ["Mount-level selectors above are claimed. read_only_text_opens_share_no_cached_pages_across_generations carries the page-cache clause of profiles/vfs-1.md:129-130: a projected Str over the 64 KiB bound is a Text node whose read-only opens reply with FopenFlags::empty(), so the kernel caches its pages; a same-length replacement must be published under a fresh inode, and the superseded inode's handle keeps the generation it captured. The row document itself is not a page-cached case: every document open requests FOPEN_DIRECT_IO (EDITABLE_OPEN_FLAGS), so the reused document inode cannot share pages across generations. The bin:orna selector is a constant check of the editable open flags and init capabilities (fuse_mount.rs), not an observation of kernel caching through a mount; it is named here, not counted as mount-level evidence (ornadb-5il1.64)."]

