]
limitations = ["Mount-level selectors above are claimed. The bin:orna selector is a constant check of the editable open flags and init capabilities (fuse_mount.rs), not an observation of kernel caching through a mount; it is named here, not counted as mount-level evidence (ornadb-5il1.64)."]

[[item]]
gate = "E"
id = "E10"
title = "Unmount and restart retain only what was acknowledged or explicitly retained as a draft"
select = [
  { record = "workspace-cli", package = "orna-cli-v1", target = "test:vfs_mount_truncate_sparse", test = "quota_rejected_write_is_not_retained_across_unmount_restart" },
