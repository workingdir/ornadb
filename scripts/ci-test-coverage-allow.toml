# Intentional gaps in CI test coverage, checked by scripts/check_ci_test_coverage.py.
# A `uncovered` entry exempts a whole test target; `uncovered_test` exempts one
# #[ignore]d test or one skipped name. Each entry needs a reason. An entry whose
# target or test is now run by a workflow step fails the check until removed.

