# Tests and checks that fail on main today.
#
# The nightly gates workflow (`scripts/gate_evidence.py run`) fails a job only
# when a failure is not listed here. A listed failure still makes its evidence
# record `failed`; this file only stops it from failing the job.
#
# Each entry names the bead that owns the fix. Delete the entry in the change
# that makes the test pass; the nightly summary reports entries whose test now
# passes. Never add an entry to hide a regression.
#
#   package       Cargo package, or "workspace" for a whole-workspace check
#   target        lib, doc, bin:NAME, test:NAME or check:NAME
#   test          exact libtest name, or "*" when the test binary aborts
#   bead          bead that owns the fix
#   reason        why it fails, and where the failure was observed
#   record        optional record ID or glob the entry is limited to (default: every record)

