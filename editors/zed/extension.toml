id = "orna"
name = "Orna"
version = "0.1.0"
schema_version = 1
authors = ["OrnaDB"]
description = "Orna language support for Zed"
repository = "https://example.invalid/OrnaDB/ornadb"

# Registers the orna-lsp language server with Zed.
#
# Current Zed versions resolve the server executable from the extension's
# src/lib.rs (a Rust shim, not part of this minimal extension) or from the
# user settings override `lsp.orna-lsp.binary.path`, which always wins. Use
# the settings override documented in README.md until a Rust shim is added.
[language_servers.orna-lsp]
name = "Orna Language Server"
languages = ["Orna"]

# The tree-sitter grammar is vendored in this repository at
# editors/tree-sitter-orna. Register it here once the grammar is published
# so highlighting works without manual setup:
# [grammars.orna]
# repository = "https://example.invalid/OrnaDB/tree-sitter-orna"
# rev = "..."
