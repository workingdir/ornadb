<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    Orna file icon: a rooted function-invocation graph on a dark tile.
    The root node at the top is the function; the two lower nodes are the
    objects it reaches. The indigo-violet palette matches the design docs.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#1c1740"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#tile)"/>

  <!-- invocation edges -->
  <g fill="none" stroke="url(#edge)" stroke-width="16" stroke-linecap="round">
    <path d="M128 72 L128 184"/>
    <path d="M128 112 L82 160"/>
    <path d="M128 112 L174 160"/>
  </g>

  <!-- object nodes -->
  <circle cx="82" cy="160" r="22" fill="#a5b4fc"/>
  <circle cx="174" cy="160" r="22" fill="#a5b4fc"/>
  <circle cx="82" cy="160" r="8" fill="#1c1740"/>
  <circle cx="174" cy="160" r="8" fill="#1c1740"/>

  <!-- root function node -->
  <circle cx="128" cy="72" r="30" fill="url(#edge)"/>
  <circle cx="128" cy="72" r="12" fill="#111c33"/>
</svg>
