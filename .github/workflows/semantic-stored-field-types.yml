name: Semantic stored field types

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  stored-field-types:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      # Only this target: the rest of orna-semantic-v1 is not gated here.
      - name: Test the orna-semantic-v1 stored field type rules
        run: cargo test --locked -p orna-semantic-v1 --test stored_field_types -- --nocapture
