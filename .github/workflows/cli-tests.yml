name: CLI tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2

# Keep each ref's native CLI gate independent. A worker branch must not replace
# main's pending test run. A newer push to the same pull request cancels that
# pull request's older run (otherwise every push queues behind the previous run and
# the wait multiplies). A push to main is keyed on its commit and is never
# cancelled: with one group per ref GitHub replaces a pending run when a newer one
# queues, so merges landing close together lost their CLI run (nine main runs ended
# "cancelled" with no jobs between a6d716278 and 8f49ea74e), and a red head could
# not be traced to the merge that caused it.
concurrency:
  group: cli-tests-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # FUSE tests must fail, not skip, on every step of this job.
    env:
      ORNA_REQUIRE_FUSE: "1"
      ORNA_REQUIRE_MEDIA_PLAYER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      # Run 41377246928 failed with `failed to build archive ... No space left on
      # device (os error 28)` while linking the test binaries, then reported every
      # unbuilt target as a test failure. The stock image carries toolchains this
      # job never uses; removing them keeps the link step inside the disk it has.
      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/chipper \
            /usr/share/swift
          sudo apt-get -y clean
          df -h /

      - name: Install the editors and media player for the Gate E suites
        # Run 39812765487 stalled in `apt-get update` for 5 h 51 m until the job cap.
        # Each network call has a per-attempt cap and a bounded retry, so a stalled
        # mirror fails and retries instead of holding the step until its timeout.
        # Downloads are separated from the install so a killed attempt never leaves
        # dpkg half-configured; apt keeps the partial .deb files and resumes them.
        timeout-minutes: 15
        run: |
          retry() {
            local attempts=$1 n
            shift
            for ((n = 1; n <= attempts; n++)); do
              if "$@"; then
                return 0
              fi
              echo "::warning::Attempt $n of $attempts failed: $*"
              sleep 5
            done
            echo "::error::Giving up after $attempts attempts: $*"
            return 1
          }
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          retry 2 sudo timeout -k 10 60 apt-get "${apt_opts[@]}" update
          retry 3 sudo timeout -k 10 150 apt-get "${apt_opts[@]}" install -y --download-only --no-install-recommends emacs-nox mpv vim
          sudo apt-get install -y --no-install-recommends emacs-nox mpv vim

      # The 10 GiB Gate B streaming test takes about an hour on its own (3611 s of a
      # 69 minute job in run 39996328261) and runs in cli-gate-b.yml instead.
      # publication_crash_matrix and migration_kill_matrix need the crash-barriers
      # feature. Their jobs below run them with that feature, so this step skips
      # them and names those jobs (--covered-by).
      - name: Test the orna-cli integration suite
        run: python3 scripts/gate_evidence.py test -p orna-cli --timeout-minutes 40 --skip-test gate_b_streams_large_network_payload_with_bounded_rss_and_zero_read_metadata --exclude-target test:vfs_media_reader --covered-by test:publication_crash_matrix=publication-crash-matrix --covered-by test:migration_kill_matrix=migration-kill-matrix

      # Gate E media reader: the crate-wide step above excludes this suite, and the record below runs it once
      # under its own diagnostic record (command, kernel, FUSE, mpv and editor versions), uploaded as an artifact.
      - name: Record the Gate E media reader evidence
        run: >-
          python3 scripts/gate_evidence.py run
          --record gate-e-media-reader
          --title "Gate E media reader: 64 MiB WAV Blob through the FUSE mount"
          --out "$RUNNER_TEMP/gate-evidence"
          --timeout-minutes 40
          --require-path /dev/fuse --require-command mpv --require-command vim
          --input-env ORNA_REQUIRE_FUSE --input-env ORNA_REQUIRE_MEDIA_PLAYER
          --tool-version 'uname -r' --tool-version 'fusermount3 -V' --tool-version 'fusermount -V'
          --tool-version 'mpv --version' --tool-version 'emacs --version' --tool-version 'vim --version'
          -- cargo test --locked -p orna-cli --test vfs_media_reader

      - name: Upload the Gate E media reader evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-e-evidence-media-reader
          path: ${{ runner.temp }}/gate-evidence
          if-no-files-found: error

  repository-v1-lib-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Test the orna-repository library suite
        run: python3 scripts/gate_evidence.py test -p orna-repository --target lib --timeout-minutes 40

  # Integration and library targets behind the acceptance gates and recent fixes.
  # Tests listed in scripts/known-test-failures.toml fail on main; they are skipped
  # here and run nightly (.github/workflows/nightly-gates.yml) until their fix lands.
  crate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      # Run 41581022886 failed with `rustc-LLVM ERROR: IO failure on output
      # stream: No space left on device` and `failed to write ... full.rmeta`
      # while building five packages' test binaries, then reported eight unbuilt
      # targets as test failures. This is the job that builds the most targets,
      # so it reaches the disk floor first; removing the toolchains the stock
      # image carries and this job never uses keeps the build inside its disk.
      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/chipper \
            /usr/share/swift
          sudo apt-get -y clean
          df -h /

      - name: Test the syntax, value, storage, project and runtime suites
        run: python3 scripts/gate_evidence.py test -p orna-syntax -p orna-value -p orna-storage -p orna-project -p orna-runtime --timeout-minutes 30

      - name: Test the orna-repository integration suites
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/gate_evidence.py test -p orna-repository --integration --timeout-minutes 30

      - name: Test the orna-evaluator library and evaluator suite
        if: ${{ !cancelled() }}
        run: python3 scripts/gate_evidence.py test -p orna-evaluator --target lib --target test:evaluator --target test:materialization_introspection --target test:evaluator_ovb2_boundary --timeout-minutes 30

  # Gate D: SIGKILL at each publication boundary. Needs the crash-barriers test feature.
  publication-crash-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Test the publication crash matrix
        shell: bash
        run: python3 scripts/gate_evidence.py test -p orna-cli --target test:publication_crash_matrix --features crash-barriers --timeout-minutes 30

  # Gate F: SIGKILL at each migration boundary. Needs the crash-barriers test feature.
  migration-kill-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Test the migration kill matrix
        shell: bash
        run: python3 scripts/gate_evidence.py test -p orna-cli --target test:migration_kill_matrix --features crash-barriers --timeout-minutes 30
