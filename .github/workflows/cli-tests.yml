name: CLI tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2

# Keep each ref's native CLI gate independent. A worker branch must not replace
# main's pending test run. A newer push to the same pull request cancels that
# pull request's older run (otherwise every push queues behind the previous run and
# the wait multiplies). A push to main is keyed on its commit and is never
# cancelled: with one group per ref GitHub replaces a pending run when a newer one
# queues, so merges landing close together lost their CLI run (nine main runs ended
# "cancelled" with no jobs between a6d716278 and 8f49ea74e), and a red head could
# not be traced to the merge that caused it.
concurrency:
  group: cli-tests-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # FUSE tests must fail, not skip, on every step of this job.
    env:
      ORNA_REQUIRE_FUSE: "1"
      ORNA_REQUIRE_MEDIA_PLAYER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install the editors and media player for the Gate E suites
        # Run 39812765487 stalled in `apt-get update` for 5 h 51 m until the job cap.
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo apt-get install -y emacs-nox mpv vim

      # The 10 GiB Gate B streaming test takes about an hour on its own (3611 s of a
      # 69 minute job in run 39996328261) and runs in cli-gate-b.yml instead.
      # publication_crash_matrix needs the crash-barriers feature. Its job below runs it with
      # that feature, so this step skips it and names that job (--covered-by).
      - name: Test the orna-cli-v1 integration suite
        run: python3 scripts/gate_evidence.py test -p orna-cli-v1 --timeout-minutes 40 --skip-test gate_b_streams_large_network_payload_with_bounded_rss_and_zero_read_metadata --exclude-target test:vfs_media_reader --covered-by test:publication_crash_matrix=publication-crash-matrix

      # Gate E media reader: the crate-wide step above excludes this suite, and the record below runs it once
      # under its own diagnostic record (command, kernel, FUSE, mpv and editor versions), uploaded as an artifact.
      - name: Record the Gate E media reader evidence
        run: >-
          python3 scripts/gate_evidence.py run
          --record gate-e-media-reader
          --title "Gate E media reader: 64 MiB WAV Blob through the FUSE mount"
          --out "$RUNNER_TEMP/gate-evidence"
          --timeout-minutes 40
          --require-path /dev/fuse --require-command mpv --require-command vim
          --input-env ORNA_REQUIRE_FUSE --input-env ORNA_REQUIRE_MEDIA_PLAYER
          --tool-version 'uname -r' --tool-version 'fusermount3 -V' --tool-version 'fusermount -V'
          --tool-version 'mpv --version' --tool-version 'emacs --version' --tool-version 'vim --version'
          -- cargo test --locked -p orna-cli-v1 --test vfs_media_reader

      - name: Upload the Gate E media reader evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-e-evidence-media-reader
          path: ${{ runner.temp }}/gate-evidence
          if-no-files-found: error

  repository-v1-lib-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Test the orna-repository-v1 library suite
        run: python3 scripts/gate_evidence.py test -p orna-repository-v1 --target lib --timeout-minutes 40

  # Integration and library targets behind the acceptance gates and recent fixes.
  # Tests listed in scripts/known-test-failures.toml fail on main; they are skipped
  # here and run nightly (.github/workflows/nightly-gates.yml) until their fix lands.
  crate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Test the syntax, value, storage, project and runtime suites
        run: python3 scripts/gate_evidence.py test -p orna-syntax-v1 -p orna-value-v1 -p orna-storage-v1 -p orna-project-v1 -p orna-runtime-v1 --timeout-minutes 30

      - name: Test the orna-repository-v1 integration suites
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/gate_evidence.py test -p orna-repository-v1 --integration --timeout-minutes 30

      - name: Test the orna-evaluator-v1 library and evaluator suite
        if: ${{ !cancelled() }}
        run: python3 scripts/gate_evidence.py test -p orna-evaluator-v1 --target lib --target test:evaluator --target test:materialization_introspection --target test:evaluator_ovb2_boundary --timeout-minutes 30

  # Gate D: SIGKILL at each publication boundary. Needs the crash-barriers test feature.
  publication-crash-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Test the publication crash matrix
        shell: bash
        run: python3 scripts/gate_evidence.py test -p orna-cli-v1 --target test:publication_crash_matrix --features crash-barriers --timeout-minutes 30
