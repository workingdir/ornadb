name: CLI tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2

# Keep each ref's native CLI gate independent. A worker branch must not replace
# main's pending test run. A newer push to the same pull request does cancel that
# pull request's older run (otherwise every push queues behind the previous run and
# the wait multiplies); main pushes are never cancelled.
concurrency:
  group: cli-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install Emacs for the editor compatibility suite
        # Run 39812765487 stalled in `apt-get update` for 5 h 51 m until the job cap.
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo apt-get install -y emacs-nox

      # The 10 GiB Gate B streaming test takes about an hour on its own (3611 s of a
      # 69 minute job in run 39996328261) and runs in cli-gate-b.yml instead.
      # publication_crash_matrix needs the crash-barriers feature. Its job below runs it with
      # that feature, so this step skips it and names that job (--covered-by).
      - name: Test the orna-cli-v1 integration suite
        env:
          ORNA_REQUIRE_FUSE: "1"
        run: python3 scripts/gate_evidence.py test -p orna-cli-v1 --timeout-minutes 40 --skip-test gate_b_streams_large_network_payload_with_bounded_rss_and_zero_read_metadata --covered-by test:publication_crash_matrix=publication-crash-matrix

  repository-v1-lib-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Test the orna-repository-v1 library suite
        run: python3 scripts/gate_evidence.py test -p orna-repository-v1 --target lib --timeout-minutes 40

  # Integration and library targets behind the acceptance gates and recent fixes.
  # Tests listed in scripts/known-test-failures.toml fail on main; they are skipped
  # here and run nightly (.github/workflows/nightly-gates.yml) until their fix lands.
  crate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Test the syntax, value, storage, project and runtime suites
        run: python3 scripts/gate_evidence.py test -p orna-syntax-v1 -p orna-value-v1 -p orna-storage-v1 -p orna-project-v1 -p orna-runtime-v1 --timeout-minutes 30

      - name: Test the orna-repository-v1 integration suites
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/gate_evidence.py test -p orna-repository-v1 --integration --timeout-minutes 30

      - name: Test the orna-evaluator-v1 library and evaluator suite
        if: ${{ !cancelled() }}
        run: python3 scripts/gate_evidence.py test -p orna-evaluator-v1 --target lib --target test:evaluator --timeout-minutes 30

  # Gate D: SIGKILL at each publication boundary. Needs the crash-barriers test feature.
  publication-crash-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Test the publication crash matrix
        shell: bash
        run: python3 scripts/gate_evidence.py test -p orna-cli-v1 --target test:publication_crash_matrix --features crash-barriers --timeout-minutes 30
