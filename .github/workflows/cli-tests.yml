name: CLI tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2

# Keep each ref's native CLI gate independent. A worker branch must not replace
# main's pending test run. A newer push to the same PR replaces that PR's own
# older run; push-to-main runs are never cancelled, so each main commit keeps
# its own result for attribution.
concurrency:
  group: cli-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == "pull_request" }}

jobs:
  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install Emacs for the editor compatibility suite
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Test the orna-cli-v1 integration suite
        env:
          ORNA_REQUIRE_FUSE: "1"
        run: cargo test --locked -p orna-cli-v1 --no-fail-fast -- --nocapture

      - name: Test the publication crash-barrier matrix
        run: cargo test --locked -p orna-cli-v1 --features crash-barriers --test publication_crash_matrix -- --nocapture
  repository-v1-lib-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Test the orna-repository-v1 library suite
        env:
          CARGO_BUILD_JOBS: 2
          RUST_TEST_THREADS: 2
        run: cargo test --locked -p orna-repository-v1 --lib --no-fail-fast -- --nocapture
