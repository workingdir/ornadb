name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

# One run per ref. A push to main is keyed on its commit and is never cancelled,
# so a red main can be traced to the merge that caused it; a newer push to the
# same pull request cancels that pull request's older run, because each push
# would otherwise queue behind the previous one.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      # Formatting needs no build, so it reports in a couple of minutes instead
      # of waiting behind the clippy compile.
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Structural gate: no compile, so it reports in about a minute instead of
  # waiting behind the clippy compile. The checker reads `cargo metadata` and the
  # size budgets; scripts/check_architecture.py owns the crate layer DAG, while
  # cargo-deny owns the external dependency policy.
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      # The fixture tests build synthetic metadata documents; the repository
      # tests at the end of the module assert that the checked-in layer table,
      # budgets and docs describe this tree, which is the stage acceptance.
      - name: Prove architecture checker behavior
        run: python3 -m unittest scripts.test_check_architecture

      - name: Check the crate layer table
        run: python3 scripts/check_architecture.py --mode=deny

      - name: Check the size budgets
        run: python3 scripts/check_architecture.py --mode=budget

      # Pinned and hash-verified because a cargo-deny upgrade changes the
      # dependency policy without any repository change.
      - name: Install pinned cargo-deny
        run: |
          set -euo pipefail
          version=0.20.2
          archive="cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}"
          for attempt in 1 2 3 4 5; do
            if curl -sSfL --retry 2 --connect-timeout 30 \
                -o "$RUNNER_TEMP/$archive" "$base/$archive" \
              && curl -sSfL --retry 2 --connect-timeout 30 \
                -o "$RUNNER_TEMP/$archive.sha256" "$base/$archive.sha256"; then
              break
            fi
            echo "::warning::cargo-deny download attempt $attempt failed"
            sleep $((attempt * 15))
          done
          expected=$(grep -oE '[0-9a-f]{64}' "$RUNNER_TEMP/$archive.sha256" | head -n1)
          actual=$(sha256sum "$RUNNER_TEMP/$archive" | cut -d' ' -f1)
          test "$actual" = "$expected"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          installer="$RUNNER_TEMP/cargo-deny-${version}-x86_64-unknown-linux-musl/cargo-deny"
          install -m 0755 "$installer" "$RUNNER_TEMP/bin/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check external dependency policy
        run: cargo deny --locked check bans licenses sources

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      # A workspace-wide all-targets clippy run links every test binary. The
      # stock image carries toolchains this job never uses; removing them keeps
      # the link step inside the disk it has (run 41377246928 ran out of space
      # while linking).
      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/chipper \
            /usr/share/swift
          sudo apt-get -y clean
          df -h /

      # Warnings are denied for the whole workspace, test targets included. Both
      # jobs moved here from the nightly gates workflow when the workspace
      # reached zero diagnostics: a lint that only runs nightly is a lint that
      # lands broken and stays broken until the next night.
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --keep-going -- -D warnings
