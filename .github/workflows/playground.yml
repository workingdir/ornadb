name: Playground

on:
  push:
    branches:
      - main
      - 'w90*-imp_play*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2

concurrency:
  group: playground-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust and the WebAssembly target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: playground/web-ui/package-lock.json

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Check generated editor and Monarch artifacts
        run: cargo run --locked -p orna-syntax-v1 --example generate_editor_artifacts -- --check

      - name: Install Monaco web UI dependencies
        working-directory: playground/web-ui
        run: npm ci

      - name: Test and build Monaco web UI
        working-directory: playground/web-ui
        run: npm test && npm run build

      - name: Test browser LSP exports through the shared analysis core
        run: cargo test --locked -p orna-lsp browser_

      - name: Test the in-database playground serve routes
        run: cargo test --locked -p orna-cli-v1 cli_serve::tests
