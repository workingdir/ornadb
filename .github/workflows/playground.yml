name: Playground

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust and the WebAssembly target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: playground/site/package-lock.json

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Test the wasm bridge in Node.js
        run: wasm-pack test --node playground/orna-wasm --locked

      - name: Build the wasm package
        run: wasm-pack build playground/orna-wasm --target web --out-dir pkg --release --locked

      - name: Install playground dependencies
        working-directory: playground/site
        run: npm ci

      - name: Build and smoke-test the Pages site
        working-directory: playground/site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build && npm run smoke-test

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playground/site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
