name: Browser profile Wasm parity

# Runs the ignored browser_profile_wasm_matches_native_canonical_output test so
# the Wasm build of the shared evaluator is proven against native canonical OVB
# output (ORNA-APP-015). The test is #[ignore] because it needs the
# wasm32-unknown-unknown target and Node.js; this job provides both.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2

concurrency:
  group: browser-profile-wasm-parity-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-profile-wasm-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust with the Wasm target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Check Node.js is available
        run: node --version

      # Runs only the ignored parity test; the rest of the crate stays on the
      # default test set. An --exact name filter that matches nothing still exits
      # 0, so first require the test to be listed exactly once, then require the
      # run to report exactly one test passed.
      - name: Run the Wasm parity test
        run: |
          set -euo pipefail
          test_name=browser_profile_wasm_matches_native_canonical_output
          listing=$(cargo test --locked -p orna-application --test browser_profile_wasm_parity -- --list --exact "$test_name")
          listed=$(printf '%s\n' "$listing" | grep -cxF "$test_name: test" || true)
          if [ "$listed" -ne 1 ]; then
            echo "expected exactly one listed test named $test_name, found $listed" >&2
            exit 1
          fi
          output=$(mktemp)
          cargo test --locked -p orna-application --test browser_profile_wasm_parity -- --ignored --exact "$test_name" 2>&1 | tee "$output"
          if ! grep -q 'test result: ok. 1 passed; 0 failed;' "$output"; then
            echo "expected exactly one passing test; the run did not report it" >&2
            exit 1
          fi
