name: Debian package Docker-isolated build/verifier summary (not fresh native Debian 12 host proof for ADR 0019)

on:
  push:
    paths:
      - ".github/workflows/debian-package.yml"
      - ".gitmodules"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "crates/orna-system-tests/**"
      - "packaging/debian/**"
      - "postgresql/Makefile"
      - "postgresql/debian12_host_preflight.py"
      - "postgresql/lifecycle_probe.c"
      - "postgresql/verify_lifecycle.py"
      - "postgresql/**"
      - "stdlib/**"
      - "third_party/postgresql"
  pull_request:
    paths:
      - ".github/workflows/debian-package.yml"
      - ".gitmodules"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "crates/orna-system-tests/**"
      - "packaging/debian/**"
      - "postgresql/Makefile"
      - "postgresql/debian12_host_preflight.py"
      - "postgresql/lifecycle_probe.c"
      - "postgresql/verify_lifecycle.py"
      - "postgresql/**"
      - "stdlib/**"
      - "third_party/postgresql"

permissions:
  contents: read

jobs:
  package:
    name: Build Debian package and collect Docker-isolated build/verifier summary (not fresh native Debian 12 host proof for ADR 0019)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: recursive
      - name: Provision the offline Rust dependency cache
        run: cargo fetch --locked
      - name: Reproduce the package twice
        run: make --file packaging/debian/rules development-package
      - name: Resolve package path from Debian changelog
        id: package
        run: |
          set -euo pipefail
          changelog="${GITHUB_WORKSPACE}/packaging/debian/changelog"
          source="$(dpkg-parsechangelog -l"${changelog}" -S Source)"
          version="$(dpkg-parsechangelog -l"${changelog}" -S Version)"
          architecture="$(dpkg --print-architecture)"
          [[ "${architecture}" == 'amd64' ]] || {
              printf '%s\n' '[debian] error: package proof requires amd64' >&2
              exit 1
          }
          package_relative="target/debian-package/${source}_${version}_${architecture}.deb"
          printf 'path=%s/%s\n' "${GITHUB_WORKSPACE}" "${package_relative}" >>"${GITHUB_OUTPUT}"
          printf 'relative_path=%s\n' "${package_relative}" >>"${GITHUB_OUTPUT}"
      - name: Collect Docker-isolated package transaction summary (not fresh native Debian 12 host proof for ADR 0019)
        env:
          ORNA_DEBIAN_PACKAGE: "${{ steps.package.outputs.path }}"
        run: >-
          crates/orna-system-tests/scenarios/debian-package.sh
          "${ORNA_DEBIAN_PACKAGE}"
      - name: Collect Docker-isolated installed build/verifier summary (not fresh native Debian 12 host proof for ADR 0019)
        env:
          ORNA_DEBIAN_PACKAGE: "${{ steps.package.outputs.path }}"
        run: >-
          crates/orna-system-tests/scenarios/debian-clean-machine.sh
          "${ORNA_DEBIAN_PACKAGE}"
      - name: Run Docker-isolated installed product test (not fresh native Debian 12 host proof for ADR 0019)
        env:
          ORNA_SYSTEM_TEST_DEBIAN_PACKAGE: "${{ steps.package.outputs.path }}"
        run: >-
          cargo test --frozen --package orna-system-tests --test installed_product
          -- --ignored --test-threads=1
      - name: Upload the reproduced package and manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orna-debian-one-executable-build-verifier-summary-docker-isolated-not-native-debian12-host-proof-adr0019
          path: |
            ${{ steps.package.outputs.relative_path }}
            target/debian-package/payload/usr/share/orna/distribution-manifest.toml
            target/debian-package/payload/usr/share/orna/embedded-engine-manifest.json
            target/debian-package/orna.dynamic
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
