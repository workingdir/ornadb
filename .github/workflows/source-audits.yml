name: Source audits

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      revision_sha:
        description: Full 40-character commit SHA to test; empty runs the source audit.
        required: false
        type: string
      cargo_package:
        description: Whitelisted Cargo package for a focused consumer test.
        required: false
        type: choice
        default: orna-cli-v1
        options:
          - orna-application-v1
          - orna-cli-v1
          - orna-evaluator-v1
          - orna-project-v1
          - orna-repository-v1
          - orna-runtime-v1
          - orna-storage-v1
      target_kind:
        description: Select library unit tests or one integration-test target.
        required: false
        type: choice
        default: lib
        options:
          - lib
          - test
      integration_target:
        description: Cargo integration target required when target_kind is test.
        required: false
        type: string
      test_filter:
        description: One Rust test-name filter (not a shell command).
        required: false
        type: string

permissions:
  contents: read

# A push to main is keyed on its commit and never cancelled, so every merge keeps its
# own fixture and editor artefact run (seven main runs on 2026-10-23 were cancelled by
# a later push, four of them while running). Pull requests and manual runs still
# cancel older runs of the same group.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.revision_sha != '' && format('source-audits|focused|{0}|{1}|{2}|{3}|{4}', inputs.revision_sha, inputs.cargo_package, inputs.target_kind, inputs.integration_target, inputs.test_filter) || format('source-audits-{0}-{1}', github.workflow, github.event_name == 'push' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  fixture-and-editor-artifacts:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.revision_sha == '' }}
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
        # The standard library mirror compiles stdlib/std bytes directly, so the job must
        # check out the submodule at the superproject gitlink (submodules: recursive).

      - name: Reject checkout and sibling reference trees
        run: |
          test ! -e reference || { echo "remove the checkout reference tree" >&2; exit 1; }
          test ! -e ../reference || { echo "remove the sibling reference tree" >&2; exit 1; }

      - name: Prove fixture manifest drift detection
        run: python3 -m unittest scripts.test_fixture_manifest

      - name: Prove standard library pin checker behavior
        run: python3 -m unittest scripts.test_standard_library_pin

      - name: Check standard library pin and Rust mirror
        run: python3 scripts/check_standard_library_pin.py --check

      - name: Check fixture paths and content hashes
        run: python3 scripts/check_fixture_manifest.py --check

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Prove citation scope equals the shipped-binary closure
        run: cargo test --locked -p orna-traceability-v1 --test scan_scope_closure
      # This ratchets citations in test code, not conformance. To lower max_uncited, update the baseline only after reviewing the cited-ID output and preserving cited_ids.
# When eligibility rules change, revalidate every dropped ID and set max_uncited to the corrected scan's exact uncited count.
      - name: Ratchet requirement citations (not conformance proof)
        run: cargo run --locked -p orna-traceability-v1 -- cited --baseline crates/orna-traceability-v1/citation-baseline.json --crates-root .

      - name: Audit fixture boundaries
        run: cargo test --locked -p orna-syntax-v1 --test fixture_audit

      - name: Prove pinned parser fixture behavior
        run: >-
          cargo test --locked -p orna-syntax-v1 --lib
          parser::tests::classifies_complete_incomplete_and_malformed_repl_inputs

      - name: Prove hash-pinned editor attachment fixture behavior
        run: >-
          cargo test --locked -p orna-lsp
          --test ji3t0_conformance --test editor_attachment_completion

      - name: Prove hash-pinned sys binding fixture behavior
        run: >-
          cargo test --locked -p orna-sys-v1
          --test sys_api_generation --test system_binding_stubs
          --test system_provider_abi

      - name: Prove hash-pinned runtime publication fixture behavior
        run: >-
          cargo test --locked -p orna-runtime-v1
          --test publication_metadata --test publication_repository_conformance

      - name: Prove hash-pinned runtime checkpoint audit fixture behavior
        run: cargo test --locked -p orna-runtime-v1 --test checkpoints_conformance_audit

      - name: Prove release vector values through production codecs
        run: cargo test --locked -p orna-value-v1 --lib

      - name: Prove final-vector VFS path components
        run: cargo test --locked -p orna-runtime-v1 --test final_vector_paths

      - name: Execute the conformance harness vector suites
        run: >-
          cargo test --locked -p orna-conformance-v1
          --test vector_suites --test protocol_vectors

      - name: Prove hash-pinned evaluator hash and random snapshot behavior
        run: >-
          cargo test --locked -p orna-evaluator-v1
          --test standard_library_hash_snapshot_27d5k
          --test standard_library_random_snapshot_27d5k

      - name: Prove std string helper behavior
        run: cargo test --locked -p orna-evaluator-v1 --test standard_library_format_strings_si45g
      - name: Prove std map merge and conflict behavior
        run: cargo test --locked -p orna-evaluator-v1 --test standard_library_map_conflicts_ln4y7

      - name: Prove std map boundary pin behavior
        run: cargo test --locked -p orna-evaluator-v1 --test standard_library_map_boundary_pins_ln4y7

      - name: Prove std map empty-side identity
        run: cargo test --locked -p orna-evaluator-v1 --test standard_library_map_empty_side_ln4y7

      - name: Prove std list reverse multiset
        run: cargo test --locked -p orna-evaluator-v1 --test standard_library_list_reverse_multiset_ln4y7

      - name: Prove std map keys order stability
        run: cargo test --locked -p orna-evaluator-v1 --test standard_library_map_keys_stable_ln4y7
      - name: Prove std map entries insertion order
        run: cargo test --locked -p orna-evaluator-v1 --test standard_library_map_entries_order_ln4y7

      - name: Prove std list concat identity
        run: cargo test --locked -p orna-evaluator-v1 --test standard_library_list_concat_identity_ln4y7

      - name: Prove std map conflict chain behavior
        run: cargo test --locked -p orna-evaluator-v1 --test standard_library_map_conflict_chain_ln4y7

      - name: Prove hash-pinned runtime historical snapshot behavior
        run: cargo test --locked -p orna-runtime-v1 --test historical_snapshots

      - name: Prove hash-pinned std snapshot replay behavior
        run: cargo test --locked -p orna-evaluator-v1 --test standard_snapshot_replay

      - name: Audit editor source and generated artifacts
        run: cargo test --locked -p orna-syntax-v1 --test editor_artifacts

      - name: Check generated editor bytes
        run: cargo run --locked -p orna-syntax-v1 --example generate_editor_artifacts -- --check

      - name: Check Tree-sitter grammar syntax
        run: node --check editors/tree-sitter-orna/grammar.js

      # The highlighter test runs each generated grammar in its real host and
      # fails, instead of skipping, when ORNA_REQUIRE_EDITORS=1 and a host is
      # missing.
      - name: Install editor hosts for the highlighter test
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox vim
          npm install --prefix "$RUNNER_TEMP/editor-tools" --no-audit --no-fund \
            tree-sitter-cli@0.26.5 vscode-textmate@9.3.2 vscode-oniguruma@2.0.1
          echo "ORNA_EDITOR_TOOLS=$RUNNER_TEMP/editor-tools" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/editor-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run every generated highlighter over the shared sample
        env:
          ORNA_REQUIRE_EDITORS: "1"
        run: cargo test --locked -p orna-syntax-v1 --test editor_highlighters

  focused-consumer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.revision_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - name: Validate focused test inputs
        shell: bash
        env:
          REVISION_SHA: ${{ inputs.revision_sha }}
          CARGO_PACKAGE: ${{ inputs.cargo_package }}
          TARGET_KIND: ${{ inputs.target_kind }}
          INTEGRATION_TARGET: ${{ inputs.integration_target }}
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          if [[ ! "$REVISION_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision_sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          case "$CARGO_PACKAGE" in
            orna-application-v1|orna-cli-v1|orna-evaluator-v1|orna-project-v1|orna-repository-v1|orna-runtime-v1|orna-storage-v1) ;;
            *) echo "::error::cargo_package is not an allowed package"; exit 1 ;;
          esac
          case "$TARGET_KIND" in
            lib)
              [[ -z "$INTEGRATION_TARGET" ]] || { echo "::error::integration_target must be empty for lib tests"; exit 1; }
              ;;
            test)
              [[ "$INTEGRATION_TARGET" =~ ^[A-Za-z0-9_][A-Za-z0-9_-]{0,63}$ ]] || { echo "::error::integration_target must be one valid Cargo target name"; exit 1; }
              ;;
            *) echo "::error::target_kind must be lib or test"; exit 1 ;;
          esac
          [[ "$TEST_FILTER" =~ ^[A-Za-z0-9_][A-Za-z0-9_:.-]{0,127}$ ]] || { echo "::error::test_filter must be one safe test-name filter"; exit 1; }

      - name: Check out exact repository revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        env:
          REVISION_SHA: ${{ inputs.revision_sha }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          printf 'Focused checkout revision: %s\n' "$actual_revision"
          test "$actual_revision" = "$REVISION_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Run focused consumer test
        shell: bash
        env:
          CARGO_PACKAGE: ${{ inputs.cargo_package }}
          TARGET_KIND: ${{ inputs.target_kind }}
          INTEGRATION_TARGET: ${{ inputs.integration_target }}
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/focused-consumer-test.log"
          if [[ "$TARGET_KIND" == "lib" ]]; then
            cargo test --locked -p "$CARGO_PACKAGE" --lib "$TEST_FILTER" -- --nocapture 2>&1 | tee "$output_file"
          else
            cargo test --locked -p "$CARGO_PACKAGE" --test "$INTEGRATION_TARGET" "$TEST_FILTER" -- --nocapture 2>&1 | tee "$output_file"
          fi
          python3 - "$output_file" <<'PY'
          import re
          import sys

          output = open(sys.argv[1], encoding="utf-8").read()
          if not re.search(r"\brunning [1-9][0-9]* tests?\b", output):
              print("::error::cargo test completed without selecting any tests", file=sys.stderr)
              raise SystemExit(1)
          PY
