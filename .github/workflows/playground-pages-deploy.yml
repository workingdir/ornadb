name: Playground Pages deploy

on:
  workflow_run:
    workflows: [Playground]
    types: [completed]
    branches:
      - main
      - 'w90*-imp_play*'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playground-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the default branch smoke checker
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download the completed build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/playground-pages/site
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the downloaded channels
        env:
          PAGES_SITE: ${{ runner.temp }}/playground-pages/site
        run: test -s "$PAGES_SITE/index.html" && test -s "$PAGES_SITE/dev/index.html"

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact for this deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/playground-pages/site

      - name: Install Node.js for published smoke checks
        uses: actions/setup-node@v7
        with:
          node-version: 22.21.1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke check the published stable and development channels
        working-directory: playground/web-ui
        run: node scripts/pages-smoke.mjs "" "${GITHUB_REPOSITORY#*/}" "${{ steps.deployment.outputs.page_url }}"
