name: Playground Pages deploy

on:
  workflow_run:
    workflows: [Playground]
    types: [completed]
    branches:
      - main
      - 'w90*-imp_play*'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playground-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the default branch smoke checker
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check whether the source run uploaded a Pages artifact
        id: pages-artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.payload.workflow_run.id;
            const result = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });
            const available = result.data.artifacts.some((artifact) => artifact.name === 'github-pages');
            core.setOutput('available', String(available));

      - name: Skip source runs without a Pages artifact
        if: steps.pages-artifact.outputs.available != 'true'
        run: echo "No Pages artifact was uploaded by this Playground run; skipping deployment."

      - name: Download the completed build artifact
        if: steps.pages-artifact.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/playground-pages/download
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js for artifact smoke checks
        if: steps.pages-artifact.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.21.1

      - name: Extract and smoke the downloaded channels
        id: extracted
        if: steps.pages-artifact.outputs.available == 'true'
        env:
          PAGES_DOWNLOAD: ${{ runner.temp }}/playground-pages/download
          PAGES_SITE: ${{ runner.temp }}/playground-pages/site
        shell: bash
        run: |
          mkdir -p "$PAGES_SITE"
          tar -xf "$PAGES_DOWNLOAD/artifact.tar" -C "$PAGES_SITE"
          if [[ ! -s "$PAGES_SITE/index.html" || ! -s "$PAGES_SITE/dev/index.html" || ! -s "$PAGES_SITE/embed.js" || ! -s "$PAGES_SITE/dev/embed.js" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No stable/dev embed entry in this artifact; skipping deployment of this older build."
            exit 0
          fi
          node playground/web-ui/scripts/pages-smoke.mjs "$PAGES_SITE" "${GITHUB_REPOSITORY#*/}"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up GitHub Pages
        if: steps.extracted.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact for this deployment
        if: steps.extracted.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/playground-pages/site

      - name: Deploy to GitHub Pages
        if: steps.extracted.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke check the published stable and development channels
        if: steps.extracted.outputs.ready == 'true'
        working-directory: playground/web-ui
        run: node scripts/pages-smoke.mjs "" "${GITHUB_REPOSITORY#*/}" "${{ steps.deployment.outputs.page_url }}"
