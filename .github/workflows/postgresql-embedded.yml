name: PostgreSQL embedded Docker-isolated build/verifier summary (not fresh native Debian 12 host proof for ADR 0019)

on:
  push:
    paths:
      - ".github/workflows/postgresql-embedded.yml"
      - ".gitmodules"
      - "third_party/postgresql"
      - "postgresql/**"
  pull_request:
    paths:
      - ".github/workflows/postgresql-embedded.yml"
      - ".gitmodules"
      - "third_party/postgresql"
      - "postgresql/**"

permissions:
  contents: read

jobs:
  build:
    name: Collect Docker-isolated embedded PostgreSQL build/verifier summary (not fresh native Debian 12 host proof for ADR 0019)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Build and compare two Docker-isolated embedded lifecycles; collect build/verifier summary (not fresh native Debian 12 host proof for ADR 0019)
        run: |
          make -C postgresql verify-lifecycle \
            TARGET_ROOT="${GITHUB_WORKSPACE}/target/postgresql-embedded-native"
      - name: Upload Docker-isolated embedded PostgreSQL build/verifier summary and static inputs (not fresh native Debian 12 host proof for ADR 0019)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-embedded-build-verifier-summary-docker-isolated-not-native-debian12-host-proof-adr0019
          path: target/postgresql-embedded-native-one/output/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
