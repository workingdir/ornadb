name: PostgreSQL embedded lifecycle

on:
  push:
    paths:
      - ".github/workflows/postgresql-embedded.yml"
      - ".gitmodules"
      - "third_party/postgresql"
      - "postgresql/**"
  pull_request:
    paths:
      - ".github/workflows/postgresql-embedded.yml"
      - ".gitmodules"
      - "third_party/postgresql"
      - "postgresql/**"

permissions:
  contents: read

jobs:
  build:
    name: Prove the embedded PostgreSQL lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Build and compare two isolated embedded lifecycles
        run: |
          make -C postgresql verify-lifecycle \
            TARGET_ROOT="${GITHUB_WORKSPACE}/target/postgresql-embedded-native"
      - name: Upload embedded PostgreSQL lifecycle evidence and static inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-embedded-lifecycle-evidence
          path: target/postgresql-embedded-native-one/output/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
