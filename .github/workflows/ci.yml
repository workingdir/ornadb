name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: extractions/setup-just@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global tree-sitter-cli@0.26.5 --no-audit --no-fund
      - run: just check
      - run: just editor-tooling-check
      - run: just kernel-test
