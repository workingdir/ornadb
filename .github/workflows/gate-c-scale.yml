name: Gate C scale (bounded)

# Gate C (implementation/ACCEPTANCE.md, "Gate C — indexed rows at scale"): ten and
# one million rows use ORP-1; indexed point/range queries, missing keys, unindexed
# scan and concurrent writes in cold and warm partial clones.
#
# This workflow is the per-change bounded half: the non-ignored row-store targets
# (ten rows, malformed graphs) and the 100k-row bounded-path tests in
# orna-repository-v1. The one-million-row case is #[ignore] in
# crates/orna-repository-v1/tests/row_store_scale.rs and is run only by the nightly
# recorder (PR 9186, nightly-gates.yml, gate-c-million-rows).
#
# Fail-honest rules:
# - each command runs through a shell step that fails when the exit status is
#   non-zero or when zero tests passed (a filtered, skipped or ignored target must
#   never report success);
# - every command writes an evidence record JSON (commit, command, toolchain,
#   elapsed time, test counts, exit status, state, log SHA-256) and the record is
#   uploaded even when the command fails. state is one of: passed, failed,
#   not-executed.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: gate-c-scale-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate-c-bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Run the bounded Gate C targets and write evidence records
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/gate-c-evidence"
          mkdir -p "$out"
          status=0

          # record-id | libtest filter arguments | cargo test arguments
          run_record() {
            local record="$1"
            shift
            local command="cargo test --locked $*"
            local log="$out/$record.log"
            local started started_epoch exit_code elapsed passed failed state
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            started_epoch=$(date +%s)
            # shellcheck disable=SC2086
            $command > "$log" 2>&1
            exit_code=$?
            cat "$log"
            elapsed=$(( $(date +%s) - started_epoch ))
            passed=$(grep -E '^test result:' "$log" | sed -nE 's/^test result: [A-Za-z]+\. ([0-9]+) passed.*/\1/p' | awk '{s+=$1} END {print s+0}')
            failed=$(grep -E '^test result:' "$log" | sed -nE 's/^test result: [A-Za-z]+\. [0-9]+ passed; ([0-9]+) failed.*/\1/p' | awk '{s+=$1} END {print s+0}')
            if [ "$exit_code" -eq 0 ] && [ "$passed" -gt 0 ]; then
              state=passed
            elif [ "$passed" -eq 0 ]; then
              state=not-executed
            else
              state=failed
            fi
            jq -n \
              --arg schema "orna-gate-c-bounded-evidence/1" \
              --arg gate "C" \
              --arg record "$record" \
              --arg commit "$GITHUB_SHA" \
              --arg ref "$GITHUB_REF" \
              --arg event "$GITHUB_EVENT_NAME" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg command "$command" \
              --arg toolchain "$(rustc --version)" \
              --arg started "$started" \
              --argjson elapsed "$elapsed" \
              --argjson exit_code "$exit_code" \
              --argjson passed "$passed" \
              --argjson failed "$failed" \
              --arg state "$state" \
              --arg log_sha256 "$(sha256sum "$log" | cut -d' ' -f1)" \
              --arg objects "not-reported: the harness prints phase timings to stderr only" \
              '{schema:$schema, gate:$gate, record:$record, commit:$commit, ref:$ref, event:$event, run_id:$run_id, command:$command, toolchain:$toolchain, started_utc:$started, elapsed_seconds:$elapsed, exit_code:$exit_code, tests_passed:$passed, tests_failed:$failed, state:$state, objects_read_written:$objects, log_sha256:$log_sha256}' \
              > "$out/$record.evidence.json"
            cat "$out/$record.evidence.json"
            if [ "$state" != passed ]; then
              echo "::error::Gate C record $record is $state (exit $exit_code, passed $passed)"
              status=1
            fi
          }

          run_record row-store-bounded -p orna-repository-v1 --test row_store_scale -- --nocapture
          run_record native-graph-insert-100k -p orna-repository-v1 --lib one_insert_into_a_100k_row_store_touches_a_bounded_path -- --nocapture
          run_record native-graph-update-path -p orna-repository-v1 --lib one_update_reads_its_path_and_at_most_two_more_pages -- --nocapture

          exit "$status"

      - name: Upload the evidence records
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-bounded-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-c-evidence
          if-no-files-found: error
